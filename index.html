        body {

            touch-action: manipulation;
            overflow-x: hidden;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            75% { transform: translateX(10px) rotate(5deg); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
        .animate-pop { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .btn-3d {
            transition: all 0.1s ease;

        }
        @keyframes float {

        let correctSynth, wrongSynth, winSynth;
        function initAudio() {
            if(!correctSynth) {
                correctSynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.2, release: 0.5 }
                }).toDestination();
                wrongSynth = new Tone.MembraneSynth().toDestination();
                winSynth = new Tone.PolySynth(Tone.Synth).toDestination();
            }
        }

        function playSound(type) {
            if (!State.soundEnabled) return;
            initAudio();
            Tone.start(); 
            const now = Tone.now();
            if (type === 'correct') {
                correctSynth.triggerAttackRelease("C6", "8n", now);
                correctSynth.triggerAttackRelease("E6", "8n", now + 0.1);
            } else if (type === 'wrong') {
                wrongSynth.triggerAttackRelease("C2", "8n", now);
            } else if (type === 'win') {
                winSynth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "4n", now);
                winSynth.triggerAttackRelease(["F4", "A4", "C5", "F5"], "4n", now + 0.3);
                winSynth.triggerAttackRelease(["G4", "B4", "D5", "G5"], "2n", now + 0.6);
            }
        }

        function toggleSound() {
            State.soundEnabled = !State.soundEnabled;
            const icon = document.querySelector('#soundToggleBtn i');
            if (State.soundEnabled) {
                icon.className = 'fa-solid fa-volume-up';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-red-500';
            }
        }

        function speakWord(text, rate = 0.85) {
            if (!State.soundEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = rate; 
            utterance.pitch = 1.2; 
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.lang.startsWith('en-') && (v.name.includes('Female') || v.name.includes('Samantha') || v.name.includes('Google')));
            if(preferredVoice) utterance.voice = preferredVoice;
            window.speechSynthesis.speak(utterance);
        }

        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        function getRandomLetters(count, excludeLetters) {
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            let result = [];
            while(result.length < count) {
                let char = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                // 確保隨機抽取的干擾字母，不會是目前單字裡的字母，也不會重複
                if (!excludeLetters.includes(char) && !result.includes(char)) {
                    result.push(char);
                }
            }
            return result;
        }

                html += `
                    <button onclick="selectCategory('${cat.id}')" 
                            class="btn-3d bg-white rounded-3xl p-4 border-4 border-kid-blue/20 flex flex-col items-center justify-center space-y-2 hover:bg-blue-50 group">
                        <div class="text-5xl group-hover:scale-110 transition-transform">${cat.icon_emoji}</div>
                        <div class="text-center">
                            <div class="text-xl font-bold text-gray-800">${cat.name}</div>
                            <div class="text-gray-500 text-sm font-semibold">${cat.nameZh}</div>
                        </div>
                    </button>
                `;
            });

            html += `
                    </div>
                </div>
            `;
            mainContainer.innerHTML = html;
        }

        async function fetchWordsForCategory(categoryId) {
            showLoading(true);
            await new Promise(resolve => setTimeout(resolve, 800)); // 模擬載入時間
            
            const allCatWords = MockDB.words.filter(w => w.category_id === categoryId);
            const shuffled = shuffleArray([...allCatWords]);
            State.gameWords = shuffled.slice(0, 10); // 隨機抽 10 題
            
            showLoading(false);
            renderPreview();
        }

        function selectCategory(categoryId) {
            initAudio();
            Tone.start(); 
            if('speechSynthesis' in window) {
                let u = new SpeechSynthesisUtterance('');
                u.volume = 0;
                window.speechSynthesis.speak(u);
            }
            State.currentCategory = MockDB.categories.find(c => c.id === categoryId);
            fetchWordsForCategory(categoryId);
        }

        function renderPreview() {
            let cardsHtml = '';
            State.gameWords.forEach((item, index) => {
                cardsHtml += `
                    <div class="bg-white rounded-2xl p-4 shadow-lg border-2 border-kid-yellow/30 flex flex-col items-center justify-center btn-3d cursor-pointer hover:border-kid-pink"
                         onclick="speakWord('${item.word}')">
                        <div class="text-5xl mb-2">${item.emoji}</div>
                        <div class="text-xl font-bold text-gray-700 tracking-wider">${item.word}</div>
                        <button class="mt-2 text-kid-blue hover:text-kid-pink">
                            <i class="fa-solid fa-volume-up"></i>
                        </button>
                    </div>
                `;
            });

            let html = `
                <div class="w-full max-w-4xl animate-pop flex flex-col items-center">
                    <h2 class="text-3xl md:text-4xl font-bold text-kid-purple mb-2 text-center">Let's Learn! 📖</h2>
                    <p class="text-lg text-gray-600 mb-6 text-center">點擊卡片聽發音，準備好就出發挑戰！</p>
                    
                    <div class="w-full bg-white/60 p-4 rounded-3xl backdrop-blur-md mb-8">
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
                            ${cardsHtml}
                        </div>
                    </div>

                    <button onclick="startGame()" class="btn-3d bg-kid-green text-white text-3xl font-bold py-4 px-12 rounded-full border-b-8 border-green-600 hover:bg-green-400 animate-pulse-fast">
                        出發去挑戰！ <i class="fa-solid fa-rocket ml-2"></i>
                    </button>
                </div>
            `;
            mainContainer.innerHTML = html;
        }

        function startGame() {
            State.currentWordIndex = 0;
            State.score = 0;
            renderGame();
        }

        function renderGame() {
            const currentItem = State.gameWords[State.currentWordIndex];
            const targetWord = currentItem.word;
            State.currentLetterIndex = 0; // 重置目前要填的字母索引
            
            setTimeout(() => speakWord(targetWord), 300);

            // 1. 建立目標輸入方塊 (空框)
            let boxesHtml = '';
            for(let i=0; i<targetWord.length; i++) {
                boxesHtml += `
                    <div id="target-box-${i}" class="w-12 h-14 md:w-16 md:h-20 bg-white border-4 border-dashed border-gray-300 rounded-xl flex items-center justify-center text-3xl md:text-5xl font-bold text-kid-blue shadow-inner transition-colors duration-200">
                    </div>
                `;
            }

            // 2. 建立打亂的字母堆 (正確字母 + 4個隨機干擾字母)
            let correctLetters = targetWord.split('');
            let distractorLetters = getRandomLetters(4, correctLetters);
            // 將正確字母與干擾字母合併後打亂順序
            let letterPool = shuffleArray(correctLetters.concat(distractorLetters));

            // 產生畫面下方的字母按鈕
            let poolHtml = '<div class="flex flex-wrap justify-center gap-3 w-full max-w-lg mx-auto">';
            letterPool.forEach((letter, index) => {
                poolHtml += `
                    <button id="letter-btn-${index}" onclick="handleLetterClick('${letter}', 'letter-btn-${index}')" 
                            class="btn-3d w-14 h-16 md:w-16 md:h-18 bg-kid-yellow text-gray-800 text-2xl md:text-3xl font-bold rounded-xl border-b-6 border-yellow-600 hover:bg-yellow-300 flex items-center justify-center active:bg-yellow-400 transition-all">
                        ${letter}
                    </button>
                `;
            });
            poolHtml += '</div>';

            let html = `
                <div class="w-full max-w-3xl flex flex-col items-center animate-pop">
                    
                    <div class="w-full flex justify-between items-center mb-4">
                        <div class="bg-white/80 px-4 py-2 rounded-full font-bold text-gray-600 shadow-sm">
                            Question: ${State.currentWordIndex + 1} / ${State.gameWords.length}
                        </div>
                        <div id="score-display" class="bg-white/80 px-4 py-2 rounded-full font-bold text-kid-yellow flex items-center shadow-sm">
                            <i class="fa-solid fa-star mr-1"></i> ${State.score}
                        </div>
                    </div>

                    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-xl w-full flex flex-col items-center relative overflow-hidden border-4 border-white">
                        
                        <div class="flex items-center gap-6 mb-6">
                            <div class="text-8xl md:text-9xl filter drop-shadow-lg">${currentItem.emoji}</div>
                            <button onclick="speakWord('${targetWord}'); speakWord('Find the letters for ${targetWord}', 1);" class="btn-3d bg-kid-blue text-white w-14 h-14 rounded-full text-xl flex items-center justify-center border-b-4 border-blue-600">
                                <i class="fa-solid fa-volume-up"></i>
                            </button>
                        </div>

                        <!-- 空白目標框區 -->
                        <div class="flex flex-wrap justify-center gap-2 md:gap-4 mb-10">
                            ${boxesHtml}
                        </div>

                        <!-- 隨機字母堆區 -->
                        <div class="bg-gray-100 p-6 rounded-2xl w-full shadow-inner border-2 border-gray-200">
                            <p class="text-center text-gray-500 font-bold mb-4">從下方選出正確的字母吧！</p>
                            ${poolHtml}
                        </div>
                    </div>
                </div>
            `;
            mainContainer.innerHTML = html;
        }

        // 處理玩家點擊隨機字母堆
        function handleLetterClick(clickedLetter, buttonId) {
            const targetWord = State.gameWords[State.currentWordIndex].word;
            const expectedLetter = targetWord[State.currentLetterIndex];
            const btnElement = document.getElementById(buttonId);

            // 如果該按鈕已經被點擊過(隱藏了)，就不理會
            if(btnElement.classList.contains('invisible')) return;

            if(clickedLetter === expectedLetter) {
                // 答對了！(點擊的是下一個正確字母)
                playSound('correct'); 
                
                // 1. 將字母填入對應的空框中
                const box = document.getElementById(`target-box-${State.currentLetterIndex}`);
                box.innerHTML = clickedLetter;
                box.classList.remove('border-dashed', 'border-gray-300');
                box.classList.add('border-solid', 'border-kid-blue', 'text-kid-blue', 'animate-pop');

                // 2. 將點擊的字母按鈕隱藏 (保留空間不破壞排版)
                btnElement.classList.add('invisible');

                // 3. 索引往前推一格
                State.currentLetterIndex++;

                // 4. 判斷是否整個字都拼完了
                if(State.currentLetterIndex === targetWord.length) {
                    // 全字拼完！加分並進入過關處理
                    State.score += 20;
                    document.getElementById('score-display').innerHTML = `<i class="fa-solid fa-star mr-1"></i> ${State.score}`;
                    
                    // 把所有框框變成綠色慶祝
                    for(let i=0; i<targetWord.length; i++) {
                        let b = document.getElementById(`target-box-${i}`);
                        b.classList.remove('border-kid-blue');
                        b.classList.add('border-kid-green', 'bg-green-100');
                    }
                    
                    // 鎖住畫面，避免小朋友亂按
                    document.querySelector('.bg-gray-100').style.pointerEvents = 'none';
                    
                    setTimeout(() => {
                        handleWordComplete(targetWord);
                    }, 500);
                }

            } else {
                // 答錯了！
                playSound('wrong'); 
                
                // 扣分機制
                if(State.score > 0) State.score -= 2;
                document.getElementById('score-display').innerHTML = `<i class="fa-solid fa-star mr-1"></i> ${Math.max(0, State.score)}`;

                // 按鈕搖晃並變紅提示
                btnElement.classList.remove('animate-shake', 'bg-red-300', 'border-red-600', 'text-white'); // 先重置
                void btnElement.offsetWidth; // 觸發瀏覽器重繪 (Reflow) 以便重新播放動畫
                btnElement.classList.add('animate-shake', 'bg-red-300', 'border-red-600', 'text-white');
                
                // 動畫結束後恢復原色
                setTimeout(() => {
                    btnElement.classList.remove('bg-red-300', 'border-red-600', 'text-white');
                }, 400);
            }
        }

        function handleWordComplete(word) {
            playSound('win');
            speakWord(`Excellent! ${word}`);
            
            // 迷你撒花特效
            confetti({
                particleCount: 50,
                spread: 60,
                origin: { y: 0.6 },
                colors: ['#43e97b', '#f6d365', '#4facfe']
            });

            // 進入下一題或結算
            setTimeout(() => {
                State.currentWordIndex++;
                if (State.currentWordIndex >= State.gameWords.length) {
                    renderResult();
                } else {
                    renderGame();
                }
            }, 2000);
        }

        function renderResult() {
            playSound('win');
            speakWord("You are a superstar! Great job!");
            
            // 大型撒花特效
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();
              if (timeLeft <= 0) return clearInterval(interval);
              var particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);

            let stars = State.score > 150 ? 3 : (State.score > 80 ? 2 : 1);
            let starHtml = '';
            for(let i=0; i<3; i++) {
                if(i < stars) {
                    starHtml += `<i class="fa-solid fa-star text-kid-yellow text-6xl md:text-8xl animate-bounce" style="animation-delay: ${i*0.2}s"></i>`;
                } else {
                    starHtml += `<i class="fa-regular fa-star text-gray-300 text-6xl md:text-8xl"></i>`;
                }
            }

            let html = `
                <div class="text-center animate-pop bg-white p-10 rounded-[3rem] shadow-2xl border-8 border-kid-yellow max-w-2xl w-full mx-auto">
                    <h1 class="text-5xl font-bold text-kid-pink mb-6">Congratulations! 🎉</h1>
                    
                    <div class="flex justify-center gap-4 mb-8">
                        ${starHtml}
                    </div>

                    <div class="text-3xl font-bold text-gray-700 mb-2">
                        Total Score: <span class="text-kid-blue">${Math.max(0, State.score)}</span>
                    </div>
                    <p class="text-xl text-gray-500 mb-10">You did an amazing job spelling!</p>

                    <button onclick="goToHome()" class="btn-3d bg-kid-blue text-white text-3xl font-bold py-4 px-12 rounded-full border-b-8 border-blue-700 hover:bg-blue-400">
                        Play Again! <i class="fa-solid fa-rotate-right ml-2"></i>
                    </button>
                </div>
            `;
            mainContainer.innerHTML = html;
        }

        function goToHome() {
            renderHome();
        }

        window.onload = function() {
            if('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => {
                    window.speechSynthesis.getVoices();
                };
            }
            renderHome();
        };
    </script>
</body>
</html>
