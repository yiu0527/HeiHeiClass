<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禧禧小遊戲樂園 🎈 | Kids Mini Game Hub</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SheetJS (XLSX / CSV 解析引擎) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Canvas Confetti 慶祝特效 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'hub-blue': '#3B82F6',
                        'hub-sky': '#0EA5E9',
                        'hub-pink': '#EC4899',
                        'hub-yellow': '#F59E0B',
                        'hub-amber': '#FCD34D',
                        'hub-green': '#10B981',
                        'hub-purple': '#8B5CF6',
                        'hub-orange': '#F97316'
                    },
                    boxShadow: {
                        'card-pop': '0 12px 28px -5px rgba(0,0,0,0.12), 0 8px 10px -6px rgba(0,0,0,0.08)'
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700;900&display=swap');

        body {
            font-family: 'Fredoka', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #fef3c7 100%);
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-3d {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.16);
        }

        .btn-3d:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.16);
        }

        .btn-3d:active {
            transform: translateY(4px) !important;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.16) !important;
        }

        .game-card {
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
        }

        .animate-float {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        .animate-pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-gray-800 antialiased selection:bg-hub-yellow selection:text-white">

    <!-- 頂部導航列 Header -->
    <header class="w-full bg-white/85 backdrop-blur-md sticky top-0 z-40 border-b-4 border-amber-200 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            
            <!-- 網站 Logo & 標題 -->
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-tr from-hub-yellow to-hub-pink rounded-2xl flex items-center justify-center text-2xl shadow-md animate-float">
                    🎮
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black bg-gradient-to-r from-blue-600 via-purple-600 to-pink-500 bg-clip-text text-transparent tracking-tight">
                        禧禧小遊戲樂園
                    </h1>
                    <p class="text-xs sm:text-sm font-bold text-gray-500 flex items-center gap-1.5">
                        <span>✨ 小朋友專屬趣味學習天地</span>
                        <span id="sheetConnectionBadge" class="hidden sm:inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-green-100 text-green-700">
                            <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                            試算表讀取中...
                        </span>
                    </p>
                </div>
            </div>

            <!-- 右側功能按鈕 (重新整理 / 設定試算表) -->
            <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="refreshData()" title="從試算表重新整理" class="btn-3d bg-white text-hub-sky hover:bg-sky-50 font-bold px-3.5 py-2 rounded-2xl border-2 border-sky-200 flex items-center gap-2 text-sm sm:text-base">
                    <i id="refreshIcon" class="fa-solid fa-rotate text-lg"></i>
                    <span class="hidden md:inline">重新整理</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 橫幅 Banner -->
    <div class="max-w-6xl mx-auto px-4 pt-6 pb-2 w-full">
        <div class="bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-600 rounded-3xl p-6 sm:p-8 text-white shadow-xl relative overflow-hidden flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="z-10 text-center md:text-left">
                <span class="bg-white/20 backdrop-blur-md px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold inline-block mb-3 border border-white/30">
                    🌟 快樂學習・探索無限
                </span>
                <h2 class="text-2xl sm:text-4xl font-extrabold tracking-wide drop-shadow-sm mb-2">
                    選擇你想玩的學習小遊戲！
                </h2>
                <p class="text-white/90 text-sm sm:text-base font-semibold max-w-xl">
                    點擊下方卡片即可直接開啟小遊戲。所有遊戲均可自由遊玩，快樂挑戰贏得大星星！
                </p>
            </div>

            <div class="hidden sm:flex text-6xl lg:text-7xl gap-3 z-10 animate-bounce" style="animation-duration: 2.5s;">
                <span>🔤</span>
                <span>🌸</span>
                <span>🚀</span>
            </div>

            <div class="absolute -top-12 -right-12 w-48 h-48 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-12 -left-12 w-48 h-48 bg-yellow-400/20 rounded-full blur-2xl pointer-events-none"></div>
        </div>
    </div>

    <!-- 分類過濾與搜尋條 -->
    <div class="max-w-6xl mx-auto px-4 py-4 w-full flex flex-col sm:flex-row justify-between items-center gap-4">
        <div id="categoryTabs" class="flex flex-wrap items-center gap-2">
            <button onclick="filterCategory('ALL')" class="category-btn active px-4 py-2 rounded-2xl font-black text-sm bg-blue-600 text-white shadow-md transition-all">
                🌟 全部遊戲 (<span id="totalGameCount">0</span>)
            </button>
        </div>

        <div class="relative w-full sm:w-64">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋遊戲名稱或主題..." 
                   class="w-full pl-10 pr-4 py-2 rounded-2xl border-2 border-gray-200 focus:border-hub-blue focus:outline-none bg-white font-medium text-sm transition-colors shadow-inner">
        </div>
    </div>

    <!-- 主要遊戲列表 Container -->
    <main class="max-w-6xl mx-auto px-4 py-2 flex-grow w-full">
        <div id="loadingState" class="flex flex-col items-center justify-center py-16">
            <div class="animate-spin text-5xl text-hub-blue mb-4">
                <i class="fa-solid fa-circle-notch"></i>
            </div>
            <p class="text-xl font-bold text-gray-600">正在從 Google 試算表讀取遊戲清單...</p>
        </div>

        <div id="gamesGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <div id="emptyState" class="hidden text-center py-16 bg-white/60 rounded-3xl border-2 border-dashed border-gray-300">
            <div class="text-6xl mb-4">🔍</div>
            <h3 class="text-2xl font-bold text-gray-700 mb-2">找不到符合的遊戲</h3>
            <p class="text-gray-500 font-medium mb-4">請嘗試更換關鍵字或點擊「全部遊戲」</p>
            <button onclick="resetFilters()" class="btn-3d bg-hub-blue text-white font-bold px-6 py-2 rounded-full">
                顯示全部遊戲
            </button>
        </div>
    </main>

    <!-- 頁腳 Footer -->
    <footer class="w-full bg-white/60 backdrop-blur-sm border-t border-gray-200 py-6 mt-10">
        <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4 text-center sm:text-left">
            <div class="text-sm font-bold text-gray-500">
                🎈 禧禧小遊戲樂園 • 開心玩，快樂學
            </div>
            <div class="flex items-center gap-2 text-xs font-semibold text-gray-400">
                <i class="fa-solid fa-code-branch"></i>
                <span>由 GitHub Pages 託管與 Google Sheets 動態驅動</span>
            </div>
        </div>
    </footer>

    <!-- JavaScript 核心腳本 -->
    <script>
        // =========================================================================
        // 1. 最新發布的 Google 試算表 XLSX 網址
        // =========================================================================
        const DEFAULT_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTZQ1EdB9OIXebPkjQbWRDA0gTZiyM_smuyuSfGLR20CziLnQN7v6yiJeN4yy_ZzrXX3PcAKOeRRyh6/pub?output=xlsx";
        const STORAGE_KEY = "KIDS_GAME_HUB_SHEET_URL_V3";

        // 離線備用資料
        const FALLBACK_GAMES = [
            {
                name: "Emoji 英文拼字遊戲",
                file: "spelling_game.html",
                emoji: "🔤",
                category: "英文學習",
                desc: "點擊可愛 Emoji 字母拼出單字，支援美式發音、音效與過關歡呼！",
                status: "啟用"
            },
            {
                name: "四季奇遇記：春夏秋冬",
                file: "seasons.html",
                emoji: "🌸",
                category: "自然常識",
                desc: "探索春夏秋冬四季故事、趣味貼紙畫布創作與 AI 說故事繪本！",
                status: "啟用"
            }
        ];

        let allGames = [];
        let currentCategory = 'ALL';
        let searchQuery = '';
        let audioCtx = null;

        function playChime(freq = 587.33, freqEnd = 880, duration = 0.2) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const now = audioCtx.currentTime;

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freqEnd, now + duration);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + duration);
            } catch (e) {}
        }

        function getActiveSheetUrl() {
            return localStorage.getItem(STORAGE_KEY) || DEFAULT_SHEET_URL;
        }

        // 取得候選請求網址 (包含 XLSX、CSV 與 CORS 代理)
        function getCandidateFetchUrls(rawUrl) {
            const trimmed = rawUrl.trim();
            const candidates = [];

            candidates.push(trimmed);

            // 若為 XLSX，加入 CSV 版本 (Google 自動支援切換)
            if (trimmed.includes('output=xlsx')) {
                candidates.push(trimmed.replace('output=xlsx', 'output=csv'));
            } else if (trimmed.includes('output=csv')) {
                candidates.push(trimmed.replace('output=csv', 'output=xlsx'));
            }

            // 若為 Google Docs 共享連結 (/spreadsheets/d/ID/edit)
            const idMatch = trimmed.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
            if (idMatch && idMatch && !trimmed.includes('/pub?')) {
                const sheetId = idMatch;
                candidates.push(`https://docs.google.com/spreadsheets/d/${sheetId}/export?format=xlsx`);
                candidates.push(`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`);
            }

            return candidates;
        }

        // 智慧抓取並解析 (支援 XLSX ArrayBuffer 與 CSV 文字)
        async function fetchAndParseData(url) {
            const candidates = getCandidateFetchUrls(url);

            for (const targetUrl of candidates) {
                // 1. 嘗試直連
                try {
                    const res = await fetch(targetUrl);
                    if (res.ok) {
                        const buffer = await res.arrayBuffer();
                        if (buffer && buffer.byteLength > 10) {
                            const parsed = parseBufferWithSheetJS(buffer);
                            if (parsed && parsed.length > 0) return parsed;
                        }
                    }
                } catch (e) {
                    console.warn(`直連 ${targetUrl} 失敗，嘗試代理...`);
                }

                // 2. 嘗試 CORS 代理 (解決本地 file:// 協議或跨網域限制)
                try {
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
                    const res = await fetch(proxyUrl);
                    if (res.ok) {
                        const buffer = await res.arrayBuffer();
                        if (buffer && buffer.byteLength > 10) {
                            const parsed = parseBufferWithSheetJS(buffer);
                            if (parsed && parsed.length > 0) return parsed;
                        }
                    }
                } catch (e) {
                    console.warn(`代理 ${targetUrl} 失敗`);
                }
            }

            throw new Error("無法從指定網址讀取或解析試算表");
        }

        // 利用 SheetJS 解析 ArrayBuffer (同時支援 XLSX 與 CSV)
        function parseBufferWithSheetJS(buffer) {
            try {
                const workbook = XLSX.read(buffer, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                // 轉為 2D 矩陣陣列
                const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                return parseGamesFrom2DArray(rows);
            } catch (err) {
                console.error("SheetJS parse error:", err);
                return null;
            }
        }

        // 智慧 2D 矩陣欄位定位解析
        function parseGamesFrom2DArray(rows) {
            if (!rows || rows.length === 0) return [];

            let headerRowIndex = -1;
            for (let i = 0; i < rows.length; i++) {
                const r = rows[i];
                if (!Array.isArray(r)) continue;
                for (let j = 0; j < r.length; j++) {
                    const cell = (r[j] || '').toString().trim().toLowerCase();
                    if (cell.includes('名稱') || cell.includes('name') || cell.includes('title') || cell === '遊戲' || cell === '小遊戲') {
                        headerRowIndex = i;
                        break;
                    }
                }
                if (headerRowIndex !== -1) break;
            }

            if (headerRowIndex === -1) headerRowIndex = 0;

            const header = rows[headerRowIndex];
            const colMap = {};

            for (let j = 0; j < header.length; j++) {
                const c = (header[j] || '').toString().trim().toLowerCase();
                if (c.includes('簡介') || c.includes('說明') || c.includes('description') || c.includes('desc') || c.includes('介紹')) {
                    colMap['desc'] = j;
                } else if (c.includes('html') || c.includes('檔案') || c.includes('file') || c.includes('link') || c.includes('path') || c.includes('url')) {
                    colMap['file'] = j;
                } else if (c.includes('圖示') || c.includes('emoji') || c.includes('icon') || c.includes('圖標')) {
                    colMap['emoji'] = j;
                } else if (c.includes('分類') || c.includes('category') || c.includes('類別') || c.includes('tag') || c.includes('類型')) {
                    colMap['category'] = j;
                } else if (c.includes('狀態') || c.includes('status') || c.includes('啟用') || c.includes('enable')) {
                    colMap['status'] = j;
                } else if (c.includes('名稱') || c.includes('name') || c.includes('title') || c === '遊戲' || c === '小遊戲') {
                    colMap['name'] = j;
                }
            }

            // 預設第 0 欄為名稱，第 1 欄為 HTML 檔名
            if (colMap['name'] === undefined && header.length > 0) colMap['name'] = 0;
            if (colMap['file'] === undefined && header.length > 1) colMap['file'] = 1;

            const games = [];
            for (let i = headerRowIndex + 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length === 0) continue;

                const getCell = (key, fallback = '') => {
                    const idx = colMap[key];
                    if (idx !== undefined && idx < row.length) {
                        const val = (row[idx] || '').toString().trim();
                        return val || fallback;
                    }
                    return fallback;
                };

                const name = getCell('name');
                const file = getCell('file');
                const emoji = getCell('emoji', '🎮') || '🎮';
                const category = getCell('category', '學習遊戲') || '學習遊戲';
                const desc = getCell('desc', '點擊開啟並開始暢玩遊戲！') || '點擊開啟並開始暢玩遊戲！';
                const status = getCell('status', '啟用') || '啟用';

                // 排除空白或停用行
                if (name && file && !status.includes('停用') && !status.includes('關閉') && !status.includes('false')) {
                    games.push({ name, file, emoji, category, desc, status });
                }
            }

            return games;
        }

        async function loadGamesData() {
            showLoading(true);
            const sheetUrl = getActiveSheetUrl();
            const badge = document.getElementById('sheetConnectionBadge');

            try {
                const parsed = await fetchAndParseData(sheetUrl);

                if (parsed && parsed.length > 0) {
                    allGames = parsed;
                    if (badge) {
                        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> 試算表已連線 (${allGames.length} 款遊戲)`;
                        badge.className = 'hidden sm:inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-green-100 text-green-700';
                    }
                } else {
                    allGames = FALLBACK_GAMES;
                    if (badge) {
                        badge.innerHTML = `⚠️ 讀取備份資料`;
                        badge.className = 'hidden sm:inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-700';
                    }
                }

                renderApp();
                showLoading(false);
            } catch (error) {
                console.warn("讀取試算表失敗，使用備用清單:", error);
                allGames = FALLBACK_GAMES;
                if (badge) {
                    badge.innerHTML = `⚠️ 離線/備用模式`;
                    badge.className = 'hidden sm:inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-700';
                }
                renderApp();
                showLoading(false);
            }
        }

        function showLoading(isLoading) {
            const loading = document.getElementById('loadingState');
            const grid = document.getElementById('gamesGrid');
            const empty = document.getElementById('emptyState');

            if (isLoading) {
                loading.classList.remove('hidden');
                grid.classList.add('hidden');
                empty.classList.add('hidden');
            } else {
                loading.classList.add('hidden');
            }
        }

        function renderApp() {
            renderCategoryTabs();
            renderGamesList();
        }

        function renderCategoryTabs() {
            const tabsContainer = document.getElementById('categoryTabs');
            const categories = Array.from(new Set(allGames.map(g => g.category)));
            
            document.getElementById('totalGameCount').innerText = allGames.length;

            let html = `
                <button onclick="filterCategory('ALL')" class="category-btn ${currentCategory === 'ALL' ? 'active bg-blue-600 text-white shadow-md' : 'bg-white text-gray-700 hover:bg-gray-100'} px-4 py-2 rounded-2xl font-black text-sm transition-all border border-gray-200">
                    🌟 全部遊戲 (${allGames.length})
                </button>
            `;

            categories.forEach(cat => {
                const count = allGames.filter(g => g.category === cat).length;
                const isActive = currentCategory === cat;
                html += `
                    <button onclick="filterCategory('${cat}')" class="category-btn ${isActive ? 'active bg-blue-600 text-white shadow-md' : 'bg-white text-gray-700 hover:bg-gray-100'} px-4 py-2 rounded-2xl font-black text-sm transition-all border border-gray-200">
                        🏷️ ${cat} (${count})
                    </button>
                `;
            });

            tabsContainer.innerHTML = html;
        }

        function renderGamesList() {
            const grid = document.getElementById('gamesGrid');
            const empty = document.getElementById('emptyState');

            const filtered = allGames.filter(game => {
                const matchCat = currentCategory === 'ALL' || game.category === currentCategory;
                const matchSearch = !searchQuery || 
                    game.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    game.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    game.category.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            grid.classList.remove('hidden');

            const cardColors = [
                { bg: 'from-amber-400 to-orange-500', btn: 'bg-amber-500 hover:bg-amber-400 border-amber-700', badge: 'bg-amber-100 text-amber-800' },
                { bg: 'from-sky-400 to-blue-600', btn: 'bg-blue-500 hover:bg-blue-400 border-blue-700', badge: 'bg-blue-100 text-blue-800' },
                { bg: 'from-emerald-400 to-teal-600', btn: 'bg-emerald-500 hover:bg-emerald-400 border-emerald-700', badge: 'bg-emerald-100 text-emerald-800' },
                { bg: 'from-pink-400 to-rose-600', btn: 'bg-pink-500 hover:bg-pink-400 border-pink-700', badge: 'bg-pink-100 text-pink-800' },
                { bg: 'from-purple-400 to-indigo-600', btn: 'bg-purple-500 hover:bg-purple-400 border-purple-700', badge: 'bg-purple-100 text-purple-800' }
            ];

            let html = '';
            filtered.forEach((game, index) => {
                const colorTheme = cardColors[index % cardColors.length];

                html += `
                    <div class="game-card bg-white rounded-3xl p-6 shadow-card-pop border-4 border-white flex flex-col justify-between relative overflow-hidden animate-pop-in" style="animation-delay: ${index * 0.05}s">
                        
                        <div class="absolute top-0 left-0 right-0 h-3 bg-gradient-to-r ${colorTheme.bg}"></div>

                        <div>
                            <div class="flex justify-between items-start mb-4 mt-2">
                                <div class="w-16 h-16 rounded-2xl bg-gray-50 border-2 border-gray-100 flex items-center justify-center text-4xl shadow-inner">
                                    ${game.emoji}
                                </div>
                                <span class="px-3 py-1 rounded-full text-xs font-black ${colorTheme.badge}">
                                    ${game.category}
                                </span>
                            </div>

                            <h3 class="text-xl sm:text-2xl font-black text-gray-800 mb-2 leading-snug">
                                ${game.name}
                            </h3>

                            <p class="text-sm font-medium text-gray-500 line-clamp-2 mb-6">
                                ${game.desc}
                            </p>
                        </div>

                        <a href="${game.file}" onclick="handleGameLaunch(event, '${game.file}', '${game.name}')" 
                           class="btn-3d w-full ${colorTheme.btn} text-white font-black py-3.5 px-6 rounded-2xl text-center flex items-center justify-center gap-2 border-b-4 shadow-lg text-lg tracking-wider">
                            <span>開始遊玩</span>
                            <i class="fa-solid fa-circle-play text-xl"></i>
                        </a>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        function filterCategory(cat) {
            playChime(659.25, 880, 0.15);
            currentCategory = cat;
            renderCategoryTabs();
            renderGamesList();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.trim();
            renderGamesList();
        }

        function resetFilters() {
            playChime();
            currentCategory = 'ALL';
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            renderApp();
        }

        function handleGameLaunch(e, file, name) {
            playChime(523.25, 1046.50, 0.3);
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 40,
                    spread: 60,
                    origin: { y: 0.8 }
                });
            }
            e.preventDefault();
            setTimeout(() => {
                window.location.href = file;
            }, 250);
        }

        function refreshData() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('animate-spin');
            playChime(784, 1046, 0.2);
            loadGamesData().then(() => {
                setTimeout(() => {
                    icon.classList.remove('animate-spin');
                }, 500);
            });
        }

        document.getElementById('configModal').addEventListener('click', (e) => {
            if (e.target.id === 'configModal') closeConfigModal();
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadGamesData();
        });
    </script>
</body>
</html>
