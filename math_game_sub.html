<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>數感大冒險（減數） - 10以內減法與倒退位移</title>
  <style>
    :root {
      --primary-color: #0288d1;
      --primary-hover: #0277bd;
      --secondary-color: #ff7043;
      --accent-green: #4caf50;
      --accent-green-hover: #388e3c;
      --bg-cream: #f0f7f4;
      --card-bg: rgba(255, 255, 255, 0.94);
      --text-dark: #263238;
      --text-muted: #546e7a;
      --shadow-sm: 0 4px 10px rgba(0,0,0,0.08);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.12);
      --shadow-lg: 0 12px 36px rgba(0,0,0,0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      background: var(--bg-cream);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: none;
    }

    /* 頂部導航與進度列 */
    header {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      z-index: 30;
      position: relative;
    }
		
	.header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
	
	/* 立體 HOME 鍵樣式 */
    .home-btn {
      background: #ffffff;
      color: #2E7D32;
      border: 2px solid #C8E6C9;
      font-size: 0.95rem;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      box-shadow: 0 3px 0 rgba(46, 125, 50, 0.2);
    }
	
    .home-btn:hover {
      background: #E8F5E9;
    }
	
    .home-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(46, 125, 50, 0.2);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0288d1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-switch-group {
      display: flex;
      background: #eceff1;
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #546e7a;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: #ffffff;
      color: #0288d1;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .progress-track {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .star-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #cfd8dc;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #78909c;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .star-dot.completed {
      background: #ffb300;
      color: #ffffff;
      transform: scale(1.15);
    }

    .star-dot.current {
      background: #0288d1;
      color: #ffffff;
      box-shadow: 0 0 0 3px rgba(2, 136, 209, 0.3);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .sound-btn {
      background: #f0f4f8;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }

    .sound-btn:active {
      transform: scale(0.9);
    }

    /* 遊戲主容器 */
    main {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 動態主題背景 SVG 容器 */
    .bg-scenery-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
      transition: opacity 0.5s ease;
    }

    .bg-scenery-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 遊戲前景操作層 */
    .game-content-layer {
      flex: 1;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* 題目引導語音氣泡 */
    .prompt-banner {
      margin: 8px auto 4px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      padding: 8px 24px;
      border-radius: 999px;
      font-size: 1.2rem;
      font-weight: 800;
      color: #263238;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 12px;
      border: 3px solid #81d4fa;
      max-width: 90%;
    }

    .prompt-speaker {
      cursor: pointer;
      font-size: 1.4rem;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
      60% { transform: translateY(-3px); }
    }

    /* =======================================================
       模式一：具體減數模式 (消去「剩餘:X個」的顯示)
       ======================================================= */
    .concrete-container {
      flex: 1;
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 16px;
      padding: 8px 24px 16px;
      height: 100%;
      overflow: hidden;
    }

    /* 左側主遊戲區（放置板） */
    .drop-play-area {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      border: 4px solid #29b6f6;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: var(--shadow-md);
      transition: all 0.2s ease;
      overflow: hidden;
    }

    /* 算式位於左側頂部，僅顯示「拿走了:X個」標籤 */
    .concrete-left-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 2px dashed rgba(2, 136, 209, 0.3);
      margin-bottom: 8px;
      z-index: 5;
    }

    .formula-badge-left {
      background: #e1f5fe;
      color: #0277bd;
      font-size: 1.75rem;
      font-weight: 900;
      padding: 6px 22px;
      border-radius: 999px;
      border: 3px solid #81d4fa;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      letter-spacing: 1px;
    }

    /* 「拿走了:X個」標籤 (不顯示剩餘數字，培養幼兒主動數數) */
    .live-counter-badge {
      background: #e53935;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    /* 遊戲區雙分區容器：左為留下的物品區，中間為虛線+減號，右為拿走區 */
    .split-playzone-wrapper {
      flex: 1;
      display: flex;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: #fafafa;
      border: 2px solid #b3e5fc;
    }

    /* 左半部：留下的物品區 (無任何「剩餘:X個」數字提示) */
    .subzone-remaining {
      flex: 1;
      position: relative;
      background: rgba(227, 242, 253, 0.65);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.2s ease;
    }

    .subzone-remaining.drag-over {
      background: rgba(187, 222, 251, 0.95);
      box-shadow: inset 0 0 0 4px #039be5;
    }

    /* 右半部：拿走區 (Taken Zone - 移出目標區) */
    .subzone-taken {
      flex: 1;
      position: relative;
      background: rgba(255, 235, 238, 0.7);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.2s ease;
    }

    .subzone-taken.drag-over {
      background: rgba(255, 205, 210, 0.95);
      box-shadow: inset 0 0 0 4px #e53935;
    }

    /* 中間立體虛線分隔線與減號 */
    .split-divider-line {
      width: 0;
      position: relative;
      border-left: 4px dashed #0288d1;
      z-index: 10;
    }

    .split-minus-badge {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: #e53935;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 900;
      box-shadow: 0 4px 10px rgba(229, 57, 53, 0.4);
      border: 3px solid #ffffff;
      pointer-events: none;
    }

    /* 各分區標籤 (消去剩餘數量顯示，只標明分區性質) */
    .subzone-header-tag {
      padding: 6px 14px;
      font-size: 0.92rem;
      font-weight: 800;
      border-radius: 0 0 14px 0;
      display: inline-block;
      width: fit-content;
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
      z-index: 5;
    }

    .tag-remaining {
      background: #bbdefb;
      color: #0d47a1;
    }

    .tag-taken {
      background: #ffcdd2;
      color: #b71c1c;
    }

    .subzone-content {
      flex: 1;
      position: relative;
      touch-action: none;
    }

    /* 遊戲區內隨機配置的 Emoji */
    .placed-emoji {
      position: absolute;
      font-size: 3.5rem;
      line-height: 1;
      cursor: grab;
      touch-action: none;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.16));
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 2;
    }

    .placed-emoji:active {
      transform: scale(1.2);
      cursor: grabbing;
    }

    @keyframes popIn {
      0% { transform: scale(0) rotate(-15deg); }
      70% { transform: scale(1.25) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* 右側：目標指示與「回答」按鈕區 */
    .target-action-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 20px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      border: 4px solid #4fc3f7;
      text-align: center;
    }

    .target-header-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0277bd;
    }

    .target-huge-number {
      font-size: 6.2rem;
      font-weight: 900;
      color: #01579b;
      line-height: 1;
      margin: 6px 0;
      text-shadow: 0 4px 12px rgba(1, 87, 155, 0.25);
    }

    .target-theme-label {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0288d1;
      margin-bottom: 10px;
    }

    /* 「回答」按鈕樣式 */
    .btn-submit-answer {
      background: linear-gradient(135deg, #0288d1 0%, #01579b 100%);
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 16px 20px;
      border-radius: 24px;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(2, 136, 209, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .btn-submit-answer:hover {
      background: linear-gradient(135deg, #039be5 0%, #0277bd 100%);
      transform: translateY(-2px);
    }

    .btn-submit-answer:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(2, 136, 209, 0.3);
    }

    .btn-reset-light {
      background: #eceff1;
      color: #455a64;
      border: 2px solid #cfd8dc;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
    }

    /* =======================================================
       模式二：數軸倒退模式 (車頭向右，向左位移代表倒車後退)
       ======================================================= */
    .numberline-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 28px 24px;
      height: 100%;
      position: relative;
    }

    /* 頂部看板 */
    .numberline-hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .numberline-formula-badge {
      background: #e1f5fe;
      color: #01579b;
      font-size: 1.8rem;
      font-weight: 900;
      padding: 8px 24px;
      border-radius: 999px;
      border: 3px solid #81d4fa;
      box-shadow: var(--shadow-sm);
    }

    .numberline-status-box {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 8px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      gap: 20px;
      border: 3px solid #81d4fa;
    }

    .status-item {
      text-align: center;
    }

    .status-label {
      font-size: 0.8rem;
      font-weight: 800;
      color: #0277bd;
    }

    .status-val {
      font-size: 1.6rem;
      font-weight: 900;
      color: #01579b;
    }

    /* 數軸軌道主區域 */
    .track-wrapper {
      position: relative;
      margin: 20px 0;
      padding: 70px 20px 45px;
    }

    /* 數軸位移跳躍弧線 SVG (向左倒退) */
    .jump-arc-svg {
      position: absolute;
      top: 0;
      left: 20px;
      right: 20px;
      height: 80px;
      pointer-events: none;
      overflow: visible;
      z-index: 12;
    }

    /* 道路本體 */
    .road-track {
      position: relative;
      height: 64px;
      background: #263238;
      border-radius: 16px;
      border: 4px solid #102027;
      box-shadow: 0 8px 20px rgba(0,0,0,0.28);
      display: flex;
      align-items: center;
    }

    /* 道路格數單元背景（10 格分割線） */
    .grid-cells-container {
      position: absolute;
      inset: 0;
      display: flex;
      pointer-events: none;
      border-radius: 12px;
      overflow: hidden;
    }

    .road-grid-cell {
      flex: 1;
      height: 100%;
      border-right: 1px dashed rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.2s ease;
    }

    .road-grid-cell:last-child {
      border-right: none;
    }

    /* 倒退走過的高亮 (紅色反向視覺) */
    .road-grid-cell.highlight-walked {
      background: rgba(229, 57, 53, 0.4);
    }

    .grid-cell-seq-tag {
      position: absolute;
      font-size: 0.8rem;
      font-weight: 900;
      color: #ffffff;
      background: rgba(211, 47, 47, 0.88);
      padding: 1px 6px;
      border-radius: 6px;
      top: 4px;
    }

    /* 刻度標記層 */
    .ticks-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .tick-node {
      position: absolute;
      top: 0;
      height: 100%;
      width: 0;
      pointer-events: auto;
    }

    .tick-line-mark {
      position: absolute;
      top: 0;
      left: 0;
      transform: translateX(-50%);
      width: 4px;
      height: 64px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 2px;
    }

    .tick-number-pill {
      position: absolute;
      bottom: -48px;
      left: 0;
      transform: translateX(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffffff;
      color: #263238;
      font-size: 1.35rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      cursor: pointer;
      transition: all 0.2s ease;
      border: 3px solid #cfd8dc;
    }

    /* 減法起點 (偏右側數字) */
    .tick-number-pill.start-point {
      background: #0288d1;
      color: #ffffff;
      border-color: #01579b;
      box-shadow: 0 0 0 4px rgba(2, 136, 209, 0.35);
    }

    /* 減法終點 (偏左側數字) */
    .tick-number-pill.target-goal {
      background: #4caf50;
      color: #ffffff;
      border-color: #2e7d32;
      transform: translateX(-50%) scale(1.22);
      box-shadow: 0 0 0 5px rgba(76, 175, 80, 0.35);
    }

    .goal-flag-icon {
      position: absolute;
      top: -55px;
      left: 0;
      transform: translateX(-50%);
      font-size: 2.6rem;
      animation: flagWiggle 1.5s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes flagWiggle {
      0%, 100% { transform: translateX(-50%) rotate(-6deg); }
      50% { transform: translateX(-50%) rotate(6deg); }
    }

    /* 可拖曳車輛：車頭明確向右 (Facing Right) */
    .draggable-vehicle {
      position: absolute;
      top: -38px;
      left: 0%;
      transform: translateX(-50%);
      width: 96px;
      height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      z-index: 20;
      transition: transform 0.1s ease;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35));
    }

    .draggable-vehicle:active {
      cursor: grabbing;
      transform: translateX(-50%) scale(1.12);
    }

    /* 車身朝右圖示容器 (車頭在右側，車尾在左側，向左移動即是倒車) */
    .vehicle-facing-right {
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* 車頂「後退倒車中」小徽章 */
    .reverse-direction-indicator {
      position: absolute;
      top: -24px;
      background: #d32f2f;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      letter-spacing: 0.5px;
      pointer-events: none;
    }

    /* 數軸下方操作欄 (回答按鈕) */
    .numberline-footer-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    .btn-submit-numberline {
      min-width: 260px;
      background: linear-gradient(135deg, #0288d1 0%, #01579b 100%);
      color: #ffffff;
      border: none;
      padding: 16px 36px;
      border-radius: 28px;
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(2, 136, 209, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .btn-submit-numberline:hover {
      transform: translateY(-2px);
    }

    .btn-submit-numberline:active {
      transform: scale(0.96);
    }

    /* 懸浮飛行鬼影 */
    .drag-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      font-size: 4.2rem;
      transform: translate(-50%, -50%) scale(1.2);
      filter: drop-shadow(0 10px 24px rgba(0,0,0,0.3));
      display: none;
    }

    /* 全螢幕彩帶動畫 Canvas */
    #celebration-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }

    /* 總結彈跳視窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .summary-card {
      background: #ffffff;
      border-radius: 36px;
      padding: 36px 48px;

      /* ==========================================================
       1. 音效合成引擎 (Web Audio API - 零外部檔案依賴)
       ========================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playPop() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const now = this.ctx.currentTime;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(360, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }

      playTick() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const now = this.ctx.currentTime;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(540, now);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }

      playHorn() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        [440, 554.37].forEach(freq => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        });
      }

      playSuccessFanfare() {
        if (this.muted) return;
        this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const now = this.ctx.currentTime + idx * 0.1;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        });
      }

      playBoing() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.linearRampToValueAtTime(130, now + 0.25);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

    const sound = new SoundEngine();

    /* ==========================================================
       2. 嚴格女性語音播報系統 (Web Speech API)
       ========================================================== */
    class SpeechSystem {
      constructor() {
        this.synth = window.speechSynthesis || null;
        this.enabled = true;
        this.voice = null;
        this.initVoices();
      }

      initVoices() {
        if (!this.synth) return;
        const load = () => {
          const voices = this.synth.getVoices();
          if (!voices || voices.length === 0) return;

          const isMale = (name) => {
            const lower = name.toLowerCase();
            const maleKw = ['male', 'man', 'boy', 'danny', 'kang', 'kangkang', 'yunxi', 'yunjian', 'zhiwei', 'wanlung', 'szeman', 'george', 'david', 'brian', 'yma'];
            return maleKw.some(k => lower.includes(k));
          };

          const isFemale = (name) => {
            if (isMale(name)) return false;
            const lower = name.toLowerCase();
            const femaleKw = [
              'female', 'woman', 'girl', 'sin-ji', 'sinji', 'hiuga', 'hiumaan', 'hiu', 'tracy',
              'tingting', 'ting-ting', 'ting', 'mei-jia', 'meijia', 'mei', 'xiao', 'xiaoxiao', 'xiaoyi',
              'yating', 'ya-ting', 'hanhan', 'hsiao', 'chen', 'yu', 'siri', 'yfa', 'tfc', 'sfg'
            ];
            return femaleKw.some(k => lower.includes(k));
          };

          // 嚴格女性語音優先選取順序：
          // 1. 廣東話 (zh-HK / yue) 女性聲音
          let selected = voices.find(v => {
            const lang = v.lang.toLowerCase();
            return (lang.includes('zh-hk') || lang.includes('yue')) && isFemale(v.name);
          });

          // 2. 國語/繁體中文 (zh-TW) 女性聲音
          if (!selected) {
            selected = voices.find(v => v.lang.toLowerCase().includes('zh-tw') && isFemale(v.name));
          }

          // 3. 中文 (zh-CN / zh) 女性聲音
          if (!selected) {
            selected = voices.find(v => v.lang.toLowerCase().includes('zh') && isFemale(v.name));
          }

          // 4. 任意標註為女性的聲音
          if (!selected) {
            selected = voices.find(v => isFemale(v.name));
          }

          // 5. 非男性的中文聲音
          if (!selected) {
            selected = voices.find(v => v.lang.toLowerCase().includes('zh') && !isMale(v.name));
          }

          this.voice = selected || null;
        };

        load();
        if (this.synth.onvoiceschanged !== undefined) {
          this.synth.onvoiceschanged = load;
        }
      }

      speak(text, onEndCallback = null) {
        if (!this.enabled || !this.synth) {
          if (onEndCallback) onEndCallback();
          return;
        }
        this.synth.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        if (this.voice) {
          utterance.voice = this.voice;
          utterance.lang = this.voice.lang;
        } else {
          utterance.lang = 'zh-HK';
        }

        // 調高音頻呈現明亮親切的幼兒女教師聲調
        utterance.rate = 0.88;
        utterance.pitch = 1.4;

        let callbackTriggered = false;
        const triggerCallback = () => {
          if (!callbackTriggered) {
            callbackTriggered = true;
            if (onEndCallback) onEndCallback();
          }
        };

        utterance.onend = triggerCallback;
        utterance.onerror = triggerCallback;

        this.synth.speak(utterance);
      }

      stop() {
        if (this.synth) this.synth.cancel();
      }
    }

    const speech = new SpeechSystem();

    /* ==========================================================
       5. 減法題庫生成器 (A - B = C, A <= 10, A >= 3, B >= 1, C >= 1)
       ========================================================== */
    class SubtractionQuestionGenerator {
      static generateQuestions(count = 10) {
        const questions = [];
        for (let i = 0; i < count; i++) {
          const theme = THEMES[Math.floor(Math.random() * THEMES.length)];
          const emoji = theme.emojis[Math.floor(Math.random() * theme.emojis.length)];
          
          const A = Math.floor(Math.random() * 8) + 3; // 3 ~ 10
          const B = Math.floor(Math.random() * (A - 1)) + 1; // 1 ~ A-1
          const C = A - B;

          questions.push({
            id: i + 1,
            A: A,
            B: B,
            C: C,
            theme: theme,
            emoji: emoji,
            retries: 0
          });
        }
        return questions;
      }
    }

    /* ==========================================================
       6. 全域遊戲狀態
       ========================================================== */
    let currentMode = 'concrete'; // 'concrete' | 'numberline'
    let questions = [];
    let currentQuestionIndex = 0;
    let currentTheme = THEMES[0];
    let isTransitioning = false;

    // 模式一：剩餘清單與拿走清單
    let remainingItems = [];
    let takenItems = [];

    // 模式二：車輛當前停靠刻度
    let numberLineCurrentTick = 0;

    // 彩帶 Canvas
    const canvas = document.getElementById('celebration-canvas');
    const ctx = canvas.getContext('2d');
    let confettiParticles = [];
    let confettiAnimationId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerConfetti() {
      confettiParticles = [];
      const colors = ['#0288d1', '#ff5722', '#ffeb3b', '#4caf50', '#e91e63', '#9c27b0'];
      for (let i = 0; i < 90; i++) {
        confettiParticles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 260,
          y: canvas.height / 2 + (Math.random() - 0.5) * 120,
          vx: (Math.random() - 0.5) * 18,
          vy: (Math.random() - 0.7) * 20,
          size: Math.random() * 12 + 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 12,
          opacity: 1
        });
      }

      if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
      renderConfetti();
    }

    function renderConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;
      confettiParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.45;
        p.rotation += p.vRot;
        p.opacity -= 0.012;

        if (p.opacity > 0) {
          alive = true;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.opacity);
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        }
      });

      if (alive) {
        confettiAnimationId = requestAnimationFrame(renderConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

      if (index >= 10) {
        showFinalSummary();

      currentQuestionIndex = index;
      isTransitioning = false;
      renderProgressBar();

      const q = questions[currentQuestionIndex];

      // 切換動態主題背景
      const sceneryContainer = document.getElementById('bg-scenery-container');
      sceneryContainer.innerHTML = currentTheme.renderBackground();

        renderConcreteQuestion(q);
      } else {
        renderNumberLineQuestion(q);
      }

    /* ==========================================================
       8. 模式一：具體減數模式 (消去「剩餘:X個」數字顯示)
       ========================================================== */
    function renderConcreteQuestion(q) {
      const { A, B, C, emoji, theme } = q;
      
      // 算式位於左側頂部
      document.getElementById('concrete-formula-left').textContent = `${A} - ? = ${C}`;
      document.getElementById('concrete-target-num').textContent = C;
      document.getElementById('concrete-theme-title').textContent = `${theme.name}（目標剩 ${C} 個）`;
      
      // 女性語音引導
      const promptStr = `這裡原本有 ${A} 個，要剩下 ${C} 個，需要拿走幾個？移到右邊拿走區，然後點「回答」！`;
      document.getElementById('prompt-text').textContent = promptStr;
      speech.speak(promptStr);

      // 重置清單：初始 A 個全部在物品區
      remainingItems = [];
      takenItems = [];

      const positions = generateRandomCoordinates(A);
      for (let i = 0; i < A; i++) {
        remainingItems.push({
          id: `item-${i}-${Date.now()}`,
          emoji: emoji,
          x: positions[i].x,
          y: positions[i].y
        });
      }

      renderRemainingItems();
      renderTakenItems();
      updateBadges();
      setupConcreteInteractiveZones();
    }

    function generateRandomCoordinates(count) {
      const coords = [];
      const minDistance = 18;

      for (let i = 0; i < count; i++) {
        let attempts = 0;
        let x, y, tooClose;
        do {
          x = Math.floor(Math.random() * 64) + 16; // 16% ~ 80%
          y = Math.floor(Math.random() * 62) + 18; // 18% ~ 80%
          tooClose = coords.some(c => Math.hypot(c.x - x, c.y - y) < minDistance);
          attempts++;
        } while (tooClose && attempts < 50);

        coords.push({ x, y });
      }
      return coords;
    }

    function renderRemainingItems() {
      const container = document.getElementById('content-remaining-zone');
      container.innerHTML = '';

      remainingItems.forEach(item => {
        const el = document.createElement('div');
        el.className = 'placed-emoji';
        el.textContent = item.emoji;
        el.id = item.id;
        el.style.left = `${item.x}%`;
        el.style.top = `${item.y}%`;
        el.style.transform = `translate(-50%, -50%) rotate(${Math.sin(item.x) * 15}deg)`;
        el.title = '點擊或拖曳至右側移走';

        setupItemPointerEvents(el, item, 'remaining');
        container.appendChild(el);
      });
    }

    function renderTakenItems() {
      const container = document.getElementById('content-taken-zone');
      container.innerHTML = '';

      takenItems.forEach(item => {
        const el = document.createElement('div');
        el.className = 'placed-emoji';

        el.title = '點擊或拖曳回左側放回';

        container.appendChild(el);
      });
    }

    // 核心修訂：消去「剩餘: X個」的數字顯示，僅顯示「拿走了: X個」
    function updateBadges() {
      const takeCount = takenItems.length;
      document.getElementById('concrete-live-count').textContent = `拿走了：${takeCount} 個`;
      // 左側純標示物品區，絕不顯示剩餘數字，培養孩子數數自檢能力
      document.getElementById('tag-remaining-label').textContent = `🌱 物品區`;
      document.getElementById('tag-taken-label').textContent = `🧺 拿走區（拿走了：${takeCount} 個）`;
    }

    function moveItemToTaken(itemObj, clientX = null, clientY = null) {
      if (isTransitioning) return;
      const idx = remainingItems.findIndex(i => i.id === itemObj.id);
      if (idx === -1) return;

      remainingItems.splice(idx, 1);
      
      const takenZone = document.getElementById('content-taken-zone');
      const rect = takenZone.getBoundingClientRect();
      let xPct, yPct;
      if (clientX !== null && clientY !== null) {
        xPct = Math.max(16, Math.min(84, ((clientX - rect.left) / rect.width) * 100));
        yPct = Math.max(18, Math.min(82, ((clientY - rect.top) / rect.height) * 100));
      } else {
        const rand = generateRandomCoordinates(1)[0];
        xPct = rand.x;
        yPct = rand.y;
      }

      itemObj.x = xPct;
      itemObj.y = yPct;
      takenItems.push(itemObj);

      renderRemainingItems();
      renderTakenItems();
      updateBadges();
      sound.playPop();
    }

    function moveItemToRemaining(itemObj, clientX = null, clientY = null) {
      if (isTransitioning) return;
      const idx = takenItems.findIndex(i => i.id === itemObj.id);
      if (idx === -1) return;

      takenItems.splice(idx, 1);

      const remZone = document.getElementById('content-remaining-zone');
      const rect = remZone.getBoundingClientRect();
      let xPct, yPct;
      if (clientX !== null && clientY !== null) {
        xPct = Math.max(16, Math.min(84, ((clientX - rect.left) / rect.width) * 100));
        yPct = Math.max(18, Math.min(82, ((clientY - rect.top) / rect.height) * 100));
      } else {
        const rand = generateRandomCoordinates(1)[0];
        xPct = rand.x;
        yPct = rand.y;
      }

      itemObj.x = xPct;
      itemObj.y = yPct;
      remainingItems.push(itemObj);

      renderRemainingItems();
      renderTakenItems();
      updateBadges();
      sound.playPop();
    }

    function resetCurrentConcreteQuestion() {
      if (isTransitioning) return;
      questions[currentQuestionIndex].retries += 1;
      sound.playBoing();
      renderConcreteQuestion(questions[currentQuestionIndex]);
    }

    function submitConcreteAnswer() {
      if (isTransitioning) return;
      const q = questions[currentQuestionIndex];
      const remCount = remainingItems.length;
      const takeCount = takenItems.length;

      if (remCount === q.C) {
        // 答對成功
        isTransitioning = true;
        document.getElementById('concrete-formula-left').textContent = `${q.A} - ${takeCount} = ${q.C}`;
        sound.playSuccessFanfare();
        triggerConfetti();

        const successSpeech = `太棒了！原本有 ${q.A} 個，拿走了 ${takeCount} 個，剛好剩下 ${q.C} 個！${q.A} 減 ${takeCount} 等於 ${q.C}！答對了！`;
        document.getElementById('prompt-text').textContent = `🎉 答對了！${q.A} - ${takeCount} = ${q.C}`;

        let advanced = false;
        const advanceToNext = () => {
          if (advanced) return;
          advanced = true;
          setTimeout(() => {
            loadQuestion(currentQuestionIndex + 1);
          }, 800);
        };

        speech.speak(successSpeech, advanceToNext);
        setTimeout(advanceToNext, 5000);
      } else {
        // 錯誤引導
        q.retries += 1;
        sound.playBoing();
        const dropArea = document.getElementById('concrete-drop-area');
        dropArea.classList.add('shake-error');
        setTimeout(() => dropArea.classList.remove('shake-error'), 450);

        if (remCount > q.C) {
          const excessRem = remCount - q.C;
          const hint = `現在留下來的太多囉！目標是剩下 ${q.C} 個，需要再拿走 ${excessRem} 個！`;
          speech.speak(hint);
          document.getElementById('prompt-text').textContent = `💡 留下的太多了，再拿走 ${excessRem} 個才能剩下 ${q.C} 個喔！`;
        } else {
          const lackRem = q.C - remCount;
          const hint = `哎呀，拿走太多了！目標是剩下 ${q.C} 個，放回 ${lackRem} 個回到左邊試試看！`;
          speech.speak(hint);
          document.getElementById('prompt-text').textContent = `⚠️ 拿走太多了！點擊右邊拿走區，放回 ${lackRem} 個喔！`;
        }
      }
    }

    const dragGhost = document.getElementById('drag-ghost');
    let activePointerId = null;

    function setupItemPointerEvents(el, itemObj, currentZoneType) {
      let isDragging = false;
      let startX = 0, startY = 0;

      el.addEventListener('pointerdown', (e) => {
        if (isTransitioning) return;
        sound.init();
        activePointerId = e.pointerId;
        el.setPointerCapture(e.pointerId);
        isDragging = false;
        startX = e.clientX;
        startY = e.clientY;

        dragGhost.textContent = itemObj.emoji;
        dragGhost.style.left = `${e.clientX}px`;
        dragGhost.style.top = `${e.clientY}px`;
      });

      el.addEventListener('pointermove', (e) => {
        if (activePointerId !== e.pointerId) return;
        if (!isDragging && (Math.hypot(e.clientX - startX, e.clientY - startY) > 8)) {
          isDragging = true;
          dragGhost.style.display = 'block';
        }

        if (isDragging) {
          dragGhost.style.left = `${e.clientX}px`;
          dragGhost.style.top = `${e.clientY}px`;

          const takenZone = document.getElementById('subzone-taken');
          const remZone = document.getElementById('subzone-remaining');

          const tRect = takenZone.getBoundingClientRect();
          const rRect = remZone.getBoundingClientRect();

          const inTaken = (e.clientX >= tRect.left && e.clientX <= tRect.right && e.clientY >= tRect.top && e.clientY <= tRect.bottom);
          const inRem = (e.clientX >= rRect.left && e.clientX <= rRect.right && e.clientY >= rRect.top && e.clientY <= rRect.bottom);

          takenZone.classList.toggle('drag-over', inTaken);
          remZone.classList.toggle('drag-over', inRem);
        }
      });

      const handlePointerEnd = (e) => {
        if (activePointerId !== e.pointerId) return;
        activePointerId = null;
        dragGhost.style.display = 'none';

        const takenZone = document.getElementById('subzone-taken');
        const remZone = document.getElementById('subzone-remaining');
        takenZone.classList.remove('drag-over');
        remZone.classList.remove('drag-over');

        const tRect = takenZone.getBoundingClientRect();
        const rRect = remZone.getBoundingClientRect();

        const inTaken = (e.clientX >= tRect.left && e.clientX <= tRect.right && e.clientY >= tRect.top && e.clientY <= tRect.bottom);
        const inRem = (e.clientX >= rRect.left && e.clientX <= rRect.right && e.clientY >= rRect.top && e.clientY <= rRect.bottom);

        if (isDragging) {
          if (currentZoneType === 'remaining' && inTaken) {
            moveItemToTaken(itemObj, e.clientX, e.clientY);
          } else if (currentZoneType === 'taken' && inRem) {
            moveItemToRemaining(itemObj, e.clientX, e.clientY);
          }
        } else {
          if (currentZoneType === 'remaining') {
            moveItemToTaken(itemObj, null, null);
          } else {
            moveItemToRemaining(itemObj, null, null);
          }
        }
      };

      el.addEventListener('pointerup', handlePointerEnd);
      el.addEventListener('pointercancel', handlePointerEnd);
    }

    function setupConcreteInteractiveZones() {
      // 保持 touch-action: none 避免捲動
    }

    /* ==========================================================
       9. 模式二：數軸倒退模式 (車頭朝右，向左位移代表倒車後退)
       ========================================================== */
    function renderNumberLineQuestion(q) {
      const { A, B, C, theme } = q;
      numberLineCurrentTick = A; // 起點在右側較大數 A

      document.getElementById('nl-formula-badge').textContent = `${A} - ? = ${C}`;
      document.getElementById('nl-start-val').textContent = A;
      document.getElementById('nl-target-val').textContent = C;
      document.getElementById('nl-step-val').textContent = `0 格`;

      const promptStr = `從起點 ${A} 倒車到終點 ${C}，需要往後退多少格？確認停妥後點「確認回答」！`;
      document.getElementById('prompt-text').textContent = promptStr;
      speech.speak(promptStr);

      // 1. 生成 10 個標準格數區塊
      const gridContainer = document.getElementById('grid-cells-container');
      gridContainer.innerHTML = '';
      for (let i = 0; i < 10; i++) {
        const cell = document.createElement('div');
        cell.className = 'road-grid-cell';
        cell.dataset.cellIndex = i;
        gridContainer.appendChild(cell);
      }

      // 2. 生成 0 ~ 10 刻度點與數字 (translateX(-50%) 居中)
      const ticksLayer = document.getElementById('ticks-layer');
      ticksLayer.innerHTML = '';

      for (let i = 0; i <= 10; i++) {
        const node = document.createElement('div');
        node.className = 'tick-node';
        node.style.left = `${i * 10}%`;

        const mark = document.createElement('div');
        mark.className = 'tick-line-mark';

        const pill = document.createElement('div');
        pill.className = 'tick-number-pill';
        pill.textContent = i;
        pill.dataset.tick = i;

        if (i === A) pill.classList.add('start-point');
        if (i === C) {
          pill.classList.add('target-goal');
          const flag = document.createElement('div');
          flag.className = 'goal-flag-icon';
          flag.textContent = '🏁';
          node.appendChild(flag);
        }

        pill.addEventListener('click', () => onNumberLineTickClick(i));

        node.appendChild(mark);
        node.appendChild(pill);
        ticksLayer.appendChild(node);
      }

      // 3. 設置車輛初始位置，注入車頭向右的向量插畫
      const vehicleGraphic = document.getElementById('vehicle-graphic');
      const vSvg = VEHICLE_SVGS[theme.vehicleType] || VEHICLE_SVGS.car;
      vehicleGraphic.innerHTML = vSvg;

      updateVehiclePosition(A);
      setupVehicleDrag();
    }

    function onNumberLineTickClick(targetTick) {
      if (isTransitioning) return;
      sound.playTick();
      updateVehiclePosition(targetTick);
    }

    function updateVehiclePosition(tick) {
      numberLineCurrentTick = tick;
      const vehicle = document.getElementById('draggable-vehicle');
      vehicle.style.left = `${tick * 10}%`;

      const q = questions[currentQuestionIndex];
      // 減法向左倒退步數 = A - tick
      const stepsBackward = q.A - tick;

      if (stepsBackward >= 0) {
        document.getElementById('nl-step-val').textContent = `${stepsBackward} 格`;
      } else {
        document.getElementById('nl-step-val').textContent = `前進過頭 ${Math.abs(stepsBackward)} 格`;
      }

      updateWalkedHighlight(q.A, tick);
    }

    function updateWalkedHighlight(startTick, currentTick) {
      const cells = document.querySelectorAll('.road-grid-cell');
      cells.forEach((cell, idx) => {
        // 向左倒退：單元格介於 currentTick 與 startTick 之間
        const isWalked = (currentTick < startTick && idx >= currentTick && idx < startTick);
        cell.classList.toggle('highlight-walked', isWalked);
        
        let tag = cell.querySelector('.grid-cell-seq-tag');
        if (isWalked) {
          const stepNum = startTick - idx;
          if (!tag) {
            tag = document.createElement('div');
            tag.className = 'grid-cell-seq-tag';
            cell.appendChild(tag);
          }
          tag.textContent = `後退${stepNum}`;
        } else if (tag) {
          tag.remove();
        }
      });

      renderJumpArcs(startTick, currentTick);
    }

    function renderJumpArcs(start, end) {
      const svg = document.getElementById('jump-arc-svg');
      svg.innerHTML = '';
      if (end >= start) return;

      const svgRect = svg.getBoundingClientRect();
      const totalWidth = svgRect.width;

      // 從右向左逐格繪製向左倒退的跳躍弧線
      for (let s = start; s > end; s--) {
        const x1 = (s / 10) * totalWidth;
        const x2 = ((s - 1) / 10) * totalWidth;
        const midX = (x1 + x2) / 2;
        const arcY = 25;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${x1} 75 Q ${midX} ${arcY} ${x2} 75`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', '#e53935');
        path.setAttribute('stroke-width', '4');
        path.setAttribute('stroke-dasharray', '6,4');
        svg.appendChild(path);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', midX);
        text.setAttribute('y', arcY - 4);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('fill', '#c62828');
        text.setAttribute('font-size', '16');
        text.setAttribute('font-weight', '900');
        text.textContent = '-1';
        svg.appendChild(text);
      }
    }

    function setupVehicleDrag() {
      const vehicle = document.getElementById('draggable-vehicle');
      const road = document.getElementById('road-track');
      let isDragging = false;
      let lastTick = numberLineCurrentTick;

      vehicle.onpointerdown = (e) => {
        if (isTransitioning) return;
        sound.init();
        isDragging = true;
        vehicle.setPointerCapture(e.pointerId);
        lastTick = numberLineCurrentTick;
      };

      vehicle.onpointermove = (e) => {
        if (!isDragging) return;
        const rect = road.getBoundingClientRect();
        const clientX = e.clientX;
        let ratio = (clientX - rect.left) / rect.width;
        ratio = Math.max(0, Math.min(1, ratio));

        const snappedTick = Math.round(ratio * 10);
        vehicle.style.left = `${snappedTick * 10}%`;

        if (snappedTick !== lastTick) {
          sound.playTick();
          lastTick = snappedTick;
          updateVehiclePosition(snappedTick);
        }
      };

      const endDrag = (e) => {
        if (!isDragging) return;
        isDragging = false;
        updateVehiclePosition(lastTick);
      };

      vehicle.onpointerup = endDrag;
      vehicle.onpointercancel = endDrag;
    }

    function resetCurrentNumberLineQuestion() {
      if (isTransitioning) return;
      const q = questions[currentQuestionIndex];
      sound.playBoing();
      updateVehiclePosition(q.A);
      speech.speak(`退回起點 ${q.A}，再數一次往左倒退幾格！`);
    }

    function submitNumberLineAnswer() {
      if (isTransitioning) return;
      const q = questions[currentQuestionIndex];
      const finalTick = numberLineCurrentTick;
      const walkedSteps = q.A - finalTick;

      if (finalTick === q.C) {
        // 答對成功
        isTransitioning = true;
        document.getElementById('nl-formula-badge').textContent = `${q.A} - ${walkedSteps} = ${q.C}`;
        sound.playHorn();
        sound.playSuccessFanfare();
        triggerConfetti();

        const successSpeech = `由 ${q.A} 倒車到 ${q.C}，剛好向左走了 ${walkedSteps} 格！${q.A} 減 ${walkedSteps} 等於 ${q.C}！答對了！`;
        document.getElementById('prompt-text').textContent = `🎉 抵達終點！倒退走 ${walkedSteps} 格 (${q.A} - ${walkedSteps} = ${q.C})`;

        let advanced = false;
        const advanceToNext = () => {
          if (advanced) return;
          advanced = true;
          setTimeout(() => {
            loadQuestion(currentQuestionIndex + 1);
          }, 800);
        };

        speech.speak(successSpeech, advanceToNext);
        setTimeout(advanceToNext, 5200);
      } else {
        // 錯誤引導
        q.retries += 1;
        sound.playBoing();
        const road = document.getElementById('road-track');
        road.classList.add('shake-error');
        setTimeout(() => road.classList.remove('shake-error'), 450);

        if (finalTick > q.C) {
          const remainNeed = finalTick - q.C;
          const hint = `現在停在 ${finalTick}，還沒倒退到終點 ${q.C} 喔！再往左邊倒退 ${remainNeed} 格！`;
          speech.speak(hint);
          document.getElementById('prompt-text').textContent = `💡 還沒到終點 ${q.C} 喔，再向左倒車後退！`;
        } else {
          const overSteps = q.C - finalTick;
          const hint = `現在停在 ${finalTick}，倒退走過頭了喔！終點是 ${q.C}，往右前進調整一下！`;
          speech.speak(hint);
          document.getElementById('prompt-text').textContent = `⚠️ 倒退走過頭了，終點是 ${q.C}！`;
        }
      }
    }

    /* ==========================================================
       10. 結算獎勵
       ========================================================== */
    function showFinalSummary() {
      isTransitioning = true;
      sound.playSuccessFanfare();
      triggerConfetti();

      let totalRetries = 0;
      questions.forEach(q => totalRetries += q.retries);

      const modal = document.getElementById('summary-modal');
      const statsContent = document.getElementById('summary-stats-content');
      statsContent.innerHTML = `
        🎉 成功完成 10 題蒙特梭利減法數感挑戰！<br>
        🌟 答題精準度：${totalRetries === 0 ? '一氣呵成！零失誤' : `穩步前進，重試次數：${totalRetries} 次`}<br>
        💡 成功掌握 10 以內的拿走減數與數軸向左倒退位移！
      `;
      modal.classList.add('show');
      speech.speak('恭喜你！完成了十道減法題目，你已經是個厲害的減法小大師囉！');
    }

    function closeSummaryModal() {
      document.getElementById('summary-modal').classList.remove('show');
    }

    function restartRound() {
      closeSummaryModal();
      questions = SubtractionQuestionGenerator.generateQuestions(10);
      loadQuestion(0);
    }

    // 啟動初始化
    window.addEventListener('DOMContentLoaded', () => {
      questions = SubtractionQuestionGenerator.generateQuestions(10);
      loadQuestion(0);
    });
  </script>
