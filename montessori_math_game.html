<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>蒙特梭利數感大冒險 - 10以內湊數與加法</title>
  <style>
    :root {
      --primary-color: #ff7043;
      --primary-hover: #f4511e;
      --secondary-color: #42a5f5;
      --accent-green: #4caf50;
      --accent-green-hover: #388e3c;
      --bg-cream: #fff9e6;
      --card-bg: rgba(255, 255, 255, 0.92);
      --text-dark: #2c3e50;
      --text-muted: #607d8b;
      --shadow-sm: 0 4px 10px rgba(0,0,0,0.08);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.12);
      --shadow-lg: 0 12px 36px rgba(0,0,0,0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      background: var(--bg-cream);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: none;
    }

    /* 頂部導航與進度列 */
    header {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      z-index: 30;
      position: relative;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ff6f00;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-switch-group {
      display: flex;
      background: #f1f3f4;
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #5f6368;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: #ffffff;
      color: #ff6f00;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .progress-track {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .star-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e0e0e0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #757575;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .star-dot.completed {
      background: #ffb300;
      color: #ffffff;
      transform: scale(1.15);
    }

    .star-dot.current {
      background: #ff7043;
      color: #ffffff;
      box-shadow: 0 0 0 3px rgba(255, 112, 67, 0.3);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .sound-btn {
      background: #f0f4f8;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }

    .sound-btn:active {
      transform: scale(0.9);
    }

    /* 遊戲主容器 */
    main {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 動態主題背景 SVG 容器 */
    .bg-scenery-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
      transition: opacity 0.5s ease;
    }

    .bg-scenery-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 遊戲前景操作層 */
    .game-content-layer {
      flex: 1;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* 題目引導語音氣泡 */
    .prompt-banner {
      margin: 8px auto 4px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      padding: 8px 24px;
      border-radius: 999px;
      font-size: 1.2rem;
      font-weight: 800;
      color: #2c3e50;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 12px;
      border: 3px solid #ffb74d;
      max-width: 90%;
    }

    .prompt-speaker {
      cursor: pointer;
      font-size: 1.4rem;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
      60% { transform: translateY(-3px); }
    }

    /* =======================================================
       模式一：具體湊數模式 (Concrete Counter Mode)
       ======================================================= */
    .concrete-container {
      flex: 1;
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 1fr auto;
      gap: 16px;
      padding: 8px 24px 16px;
      height: 100%;
      overflow: hidden;
    }

    /* 左側主遊戲區（放置板） */
    .drop-play-area {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      border: 4px solid #ffa726;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: var(--shadow-md);
      transition: all 0.2s ease;
      overflow: hidden;
    }

    /* 算式位於左側頂部 */
    .concrete-left-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 2px dashed rgba(255, 152, 0, 0.4);
      margin-bottom: 8px;
      z-index: 5;
    }

    .formula-badge-left {
      background: #fff3e0;
      color: #e65100;
      font-size: 1.75rem;
      font-weight: 900;
      padding: 6px 22px;
      border-radius: 999px;
      border: 3px solid #ffb74d;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      letter-spacing: 1px;
    }

    /* 「加了:X個」顯示標籤 */
    .live-counter-badge {
      background: #4caf50;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    /* 遊戲區雙分區容器 (原有範圍 VS 加入範圍，中間以虛線隔開) */
    .split-playzone-wrapper {
      flex: 1;
      display: flex;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: #fafafa;
      border: 2px solid #ffe082;
    }

    /* 左半部：原有範圍 (Initial Zone) */
    .subzone-initial {
      flex: 1;
      position: relative;
      background: rgba(255, 248, 225, 0.7);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 右半部：加入範圍 (Added Zone - 拖曳放置目標) */
    .subzone-added {
      flex: 1;
      position: relative;
      background: rgba(232, 245, 233, 0.7);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.2s ease;
    }

    .subzone-added.drag-over {
      background: rgba(200, 230, 201, 0.95);
      box-shadow: inset 0 0 0 4px #4caf50;
    }

    /* 中間立體虛線分隔線與加號 */
    .split-divider-line {
      width: 0;
      position: relative;
      border-left: 4px dashed #ff9800;
      z-index: 10;
    }

    .split-plus-badge {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: #ff9800;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 900;
      box-shadow: 0 4px 10px rgba(255, 152, 0, 0.4);
      border: 3px solid #ffffff;
      pointer-events: none;
    }

    /* 各分區標題標籤 */
    .subzone-header-tag {
      padding: 6px 14px;
      font-size: 0.92rem;
      font-weight: 800;
      border-radius: 0 0 14px 0;
      display: inline-block;
      width: fit-content;
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
      z-index: 5;
    }

    .tag-initial {
      background: #ffe082;
      color: #b26a00;
    }

    .tag-added {
      background: #c8e6c9;
      color: #2e7d32;
    }

    .subzone-content {
      flex: 1;
      position: relative;
      touch-action: none;
    }

    /* 遊戲區內隨機配置的 Emoji */
    .placed-emoji {
      position: absolute;
      font-size: 3.4rem;
      line-height: 1;
      cursor: pointer;
      touch-action: none;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.16));
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 2;
    }

    .placed-emoji:active {
      transform: scale(1.18);
    }

    .placed-emoji.initial {
      cursor: default;
    }

    .placed-emoji.user-added {
      cursor: pointer;
    }

    @keyframes popIn {
      0% { transform: scale(0) rotate(-15deg); }
      70% { transform: scale(1.25) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* 右側：目標指示與「回答」按鈕區 */
    .target-action-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 20px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      border: 4px solid #81c784;
      text-align: center;
    }

    .target-header-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #2e7d32;
    }

    .target-huge-number {
      font-size: 6.2rem;
      font-weight: 900;
      color: #1b5e20;
      line-height: 1;
      margin: 6px 0;
      text-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
    }

    .target-theme-label {
      font-size: 1.05rem;
      font-weight: 700;
      color: #558b2f;
      margin-bottom: 10px;
    }

    /* 「回答」按鈕樣式 */
    .btn-submit-answer {
      background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 16px 20px;
      border-radius: 24px;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(76, 175, 80, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .btn-submit-answer:hover {
      background: linear-gradient(135deg, #66bb6a 0%, #388e3c 100%);
      transform: translateY(-2px);
    }

    .btn-submit-answer:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
    }

    .btn-reset-light {
      background: #fbe9e7;
      color: #d84315;
      border: 2px solid #ffccbc;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
    }

    /* 底端籌碼庫 (Reservoir Shelf) */
    .reservoir-shelf {
      grid-column: 1 / -1;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 10px 20px;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 16px;
      border: 3px solid #ffd54f;
    }

    .reservoir-hint {
      display: flex;
      flex-direction: column;
      min-width: 130px;
    }

    .reservoir-hint-title {
      font-size: 1.1rem;
      font-weight: 900;
      color: #f57f17;
    }

    .reservoir-hint-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .reservoir-items-row {
      flex: 1;
      display: flex;
      gap: 10px;
      align-items: center;
      overflow-x: auto;
      padding: 4px;
    }

    .reservoir-chip {
      width: 66px;
      height: 66px;
      min-width: 66px;
      border-radius: 18px;
      background: #fff8e1;
      border: 3px solid #ffb300;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      line-height: 1;
      cursor: grab;
      touch-action: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .reservoir-chip:active {
      transform: scale(0.92);
      cursor: grabbing;
    }

    /* =======================================================
       模式二：數軸位移模式 (Semi-Concrete Number Line Mode)
       ======================================================= */
    .numberline-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 28px 24px;
      height: 100%;
      position: relative;
    }

    /* 頂部看板 */
    .numberline-hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .numberline-formula-badge {
      background: #e3f2fd;
      color: #0d47a1;
      font-size: 1.8rem;
      font-weight: 900;
      padding: 8px 24px;
      border-radius: 999px;
      border: 3px solid #64b5f6;
      box-shadow: var(--shadow-sm);
    }

    .numberline-status-box {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 8px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      gap: 20px;
      border: 3px solid #90caf9;
    }

    .status-item {
      text-align: center;
    }

    .status-label {
      font-size: 0.8rem;
      font-weight: 800;
      color: #1565c0;
    }

    .status-val {
      font-size: 1.6rem;
      font-weight: 900;
      color: #0d47a1;
    }

    /* 數軸軌道主區域 */
    .track-wrapper {
      position: relative;
      margin: 20px 0;
      padding: 70px 20px 45px;
    }

    /* 數軸位移跳躍弧線 SVG */
    .jump-arc-svg {
      position: absolute;
      top: 0;
      left: 20px;
      right: 20px;
      height: 80px;
      pointer-events: none;
      overflow: visible;
      z-index: 12;
    }

    /* 道路本體 */
    .road-track {
      position: relative;
      height: 64px;
      background: #263238;
      border-radius: 16px;
      border: 4px solid #102027;
      box-shadow: 0 8px 20px rgba(0,0,0,0.28);
      display: flex;
      align-items: center;
    }

    /* 道路格數單元背景（10 格分割線） */
    .grid-cells-container {
      position: absolute;
      inset: 0;
      display: flex;
      pointer-events: none;
      border-radius: 12px;
      overflow: hidden;
    }

    .road-grid-cell {
      flex: 1;
      height: 100%;
      border-right: 1px dashed rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.2s ease;
    }

    .road-grid-cell:last-child {
      border-right: none;
    }

    .road-grid-cell.highlight-walked {
      background: rgba(255, 179, 0, 0.35);
    }

    .grid-cell-seq-tag {
      position: absolute;
      font-size: 0.8rem;
      font-weight: 900;
      color: #ffeb3b;
      background: rgba(0, 0, 0, 0.6);
      padding: 1px 6px;
      border-radius: 6px;
      top: 4px;
    }

    /* 刻度標記層 */
    .ticks-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .tick-node {
      position: absolute;
      top: 0;
      height: 100%;
      width: 0;
      pointer-events: auto;
    }

    .tick-line-mark {
      position: absolute;
      top: 0;
      left: 0;
      transform: translateX(-50%);
      width: 4px;
      height: 64px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 2px;
    }

    .tick-number-pill {
      position: absolute;
      bottom: -48px;
      left: 0;
      transform: translateX(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffffff;
      color: #263238;
      font-size: 1.35rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      cursor: pointer;
      transition: all 0.2s ease;
      border: 3px solid #cfd8dc;
    }

    .tick-number-pill.start-point {
      background: #ff9800;
      color: #ffffff;
      border-color: #f57c00;
      box-shadow: 0 0 0 4px rgba(255, 152, 0, 0.35);
    }

    .tick-number-pill.target-goal {
      background: #4caf50;
      color: #ffffff;
      border-color: #388e3c;
      transform: translateX(-50%) scale(1.22);
      box-shadow: 0 0 0 5px rgba(76, 175, 80, 0.35);
    }

    .goal-flag-icon {
      position: absolute;
      top: -55px;
      left: 0;
      transform: translateX(-50%);
      font-size: 2.6rem;
      animation: flagWiggle 1.5s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes flagWiggle {
      0%, 100% { transform: translateX(-50%) rotate(-6deg); }
      50% { transform: translateX(-50%) rotate(6deg); }
    }

    /* 可拖曳車輛 */
    .draggable-vehicle {
      position: absolute;
      top: -36px;
      left: 0%;
      transform: translateX(-50%);
      width: 86px;
      height: 86px;
      font-size: 4.2rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      z-index: 20;
      transition: transform 0.1s ease;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35));
    }

    .draggable-vehicle:active {
      cursor: grabbing;
      transform: translateX(-50%) scale(1.15);
    }

    /* 數軸下方操作欄 (回答按鈕) */
    .numberline-footer-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    .btn-submit-numberline {
      min-width: 260px;
      background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
      color: #ffffff;
      border: none;
      padding: 16px 36px;
      border-radius: 28px;
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(76, 175, 80, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .btn-submit-numberline:hover {
      transform: translateY(-2px);
    }

    .btn-submit-numberline:active {
      transform: scale(0.96);
    }

    /* 懸浮飛行鬼影 */
    .drag-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      font-size: 4.2rem;
      transform: translate(-50%, -50%) scale(1.2);
      filter: drop-shadow(0 10px 24px rgba(0,0,0,0.3));
      display: none;
    }

    /* 全螢幕彩帶動畫 Canvas */
    #celebration-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }

    /* 總結彈跳視窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .summary-card {
      background: #ffffff;
      border-radius: 36px;
      padding: 36px 48px;
      max-width: 520px;
      width: 90%;
      text-align: center;
      box-shadow: var(--shadow-lg);
      transform: scale(0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 6px solid #ffd54f;
    }
	
	.header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
	
	/* 立體 HOME 鍵樣式 */
    .home-btn {
      background: #ffffff;
      color: #2E7D32;
      border: 2px solid #C8E6C9;
      font-size: 0.95rem;
      font-weight: bold;

    /* ==========================================================
       1. 音效合成引擎 (Web Audio API - 零外部檔案依賴)
       ========================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playPop() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const now = this.ctx.currentTime;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }

      playTick() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const now = this.ctx.currentTime;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(620, now);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }

      playHorn() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        [392, 523.25].forEach(freq => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        });
      }

      playSuccessFanfare() {
        if (this.muted) return;
        this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const now = this.ctx.currentTime + idx * 0.1;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        });
      }

      playBoing() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.linearRampToValueAtTime(130, now + 0.25);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

    const sound = new SoundEngine();

    /* ==========================================================
       2. 語音播報系統 (Web Speech API - 嚴選女性發音與結束回呼)
       ========================================================= */
    class SpeechSystem {
      constructor() {
        this.synth = window.speechSynthesis || null;
        this.enabled = true;
        this.voice = null;
        this.initVoices();
      }

      initVoices() {
        if (!this.synth) return;
        const load = () => {
          const voices = this.synth.getVoices();
          if (!voices || voices.length === 0) return;

          // 女性聲音關鍵字判斷
          const isFemale = (name) => {
            const lower = name.toLowerCase();
            const femaleKw = ['female', 'woman', 'girl', 'sin-ji', 'sinji', 'hiu', 'ting', 'mei', 'xiao', 'yating', 'hanhan', 'chen', 'yu', 'tracy', '粵語', 'siri'];
            const maleKw = ['male', 'man', 'boy', 'danny', 'kang', 'yunxi', 'yunjian', 'zhiwei'];
            if (maleKw.some(k => lower.includes(k))) return false;
            return femaleKw.some(k => lower.includes(k));
          };

          // 1. 優先選取廣東話 (zh-HK / yue) 女性語音
          let selected = voices.find(v => (v.lang.includes('zh-HK') || v.lang.includes('yue')) && isFemale(v.name));
          
          // 2. 次選任意廣東話語音
          if (!selected) {
            selected = voices.find(v => v.lang.includes('zh-HK') || v.lang.includes('yue'));
          }

          // 3. 次選國語/繁體 (zh-TW) 女性語音
          if (!selected) {
            selected = voices.find(v => v.lang.includes('zh-TW') && isFemale(v.name));
          }

          // 4. 次選中文 (zh-CN) 女性語音
          if (!selected) {
            selected = voices.find(v => v.lang.includes('zh') && isFemale(v.name));
          }

          // 5. 備用中文語音
          if (!selected) {
            selected = voices.find(v => v.lang.includes('zh'));
          }

          this.voice = selected || null;
        };

        load();
        if (this.synth.onvoiceschanged !== undefined) {
          this.synth.onvoiceschanged = load;
        }
      }

      speak(text, onEndCallback = null) {
        if (!this.enabled || !this.synth) {
          if (onEndCallback) onEndCallback();
          return;
        }
        this.synth.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        if (this.voice) {
          utterance.voice = this.voice;
          utterance.lang = this.voice.lang;
        } else {
          utterance.lang = 'zh-HK';
        }

        // 女性音調調優：調高音調 (pitch: 1.35) 呈現親切甜美幼兒教師女聲
        utterance.rate = 0.88; // 稍慢適中節奏
        utterance.pitch = 1.35; // 甜美女性幼兒語調

        let callbackTriggered = false;
        const triggerCallback = () => {
          if (!callbackTriggered) {
            callbackTriggered = true;
            if (onEndCallback) onEndCallback();
          }
        };

        utterance.onend = triggerCallback;
        utterance.onerror = triggerCallback;

        this.synth.speak(utterance);
      }

      stop() {
        if (this.synth) this.synth.cancel();
      }
    }

    const speech = new SpeechSystem();

    /* ==========================================================
       4. 題庫生成器 (Question Generator: A + B = C, C <= 10)
       ========================================================== */
    class QuestionGenerator {
      static generateQuestions(count = 10) {
        const questions = [];
        for (let i = 0; i < count; i++) {
          const theme = THEMES[Math.floor(Math.random() * THEMES.length)];
          const emoji = theme.emojis[Math.floor(Math.random() * theme.emojis.length)];
          
          const C = Math.floor(Math.random() * 8) + 3; // 3 ~ 10
          const A = Math.floor(Math.random() * (C - 1)) + 1; // 1 ~ C-1
          const B = C - A;

          questions.push({
            id: i + 1,
            A: A,
            B: B,
            C: C,
            theme: theme,
            emoji: emoji,
            retries: 0
          });
        }
        return questions;
      }
    }

    /* ==========================================================
       5. 全域遊戲狀態
       ========================================================== */
    let currentMode = 'concrete'; // 'concrete' | 'numberline'
    let questions = [];
    let currentQuestionIndex = 0;
    let currentTheme = THEMES[0];
    let isTransitioning = false;

    // 模式一：原有清單與加入清單分離
    // initialItems: [ { id: 'init-0', emoji: '🍎', x: 25, y: 40 }, ... ]
    // addedItems:   [ { id: 'user-0', emoji: '🍎', x: 55, y: 35 }, ... ]
    let initialItems = [];
    let addedItems = [];
    let reservoirCount = 10;

    // 模式二：車輛當前停靠的刻度
    let numberLineCurrentTick = 0;

    // 彩帶 Canvas
    const canvas = document.getElementById('celebration-canvas');
    const ctx = canvas.getContext('2d');
    let confettiParticles = [];
    let confettiAnimationId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerConfetti() {
      confettiParticles = [];
      const colors = ['#ff5722', '#ffeb3b', '#4caf50', '#00bcd4', '#e91e63', '#9c27b0'];
      for (let i = 0; i < 90; i++) {
        confettiParticles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 260,
          y: canvas.height / 2 + (Math.random() - 0.5) * 120,
          vx: (Math.random() - 0.5) * 18,
          vy: (Math.random() - 0.7) * 20,
          size: Math.random() * 12 + 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 12,
          opacity: 1
        });
      }

      if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
      renderConfetti();
    }

    function renderConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;
      confettiParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.45;
        p.rotation += p.vRot;
        p.opacity -= 0.012;

        if (p.opacity > 0) {
          alive = true;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.opacity);
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        }
      });

      if (alive) {
        confettiAnimationId = requestAnimationFrame(renderConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    /* ==========================================================
       6. 模式切換與全域控制
       ========================================================== */
    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-concrete').classList.toggle('active', mode === 'concrete');
      document.getElementById('btn-mode-numberline').classList.toggle('active', mode === 'numberline');

      document.getElementById('concrete-container').style.display = (mode === 'concrete') ? 'grid' : 'none';
      document.getElementById('numberline-container').style.display = (mode === 'numberline') ? 'flex' : 'none';

      loadQuestion(currentQuestionIndex);
    }

    function toggleVoice() {
      speech.enabled = !speech.enabled;
      sound.muted = !speech.enabled;
      const btn = document.getElementById('btn-voice-toggle');
      btn.textContent = speech.enabled ? '🔊' : '🔇';
      if (speech.enabled) {
        speakCurrentPrompt();
      } else {
        speech.stop();
      }
    }

    function speakCurrentPrompt() {
      const text = document.getElementById('prompt-text').textContent;
      speech.speak(text);
    }

    function renderProgressBar() {
      const track = document.getElementById('progress-track');
      track.innerHTML = '';
      for (let i = 0; i < 10; i++) {
        const dot = document.createElement('div');
        dot.className = 'star-dot';
        if (i < currentQuestionIndex) {
          dot.classList.add('completed');
          dot.textContent = '★';
        } else if (i === currentQuestionIndex) {
          dot.classList.add('current');
          dot.textContent = (i + 1);
        } else {
          dot.textContent = (i + 1);
        }
        track.appendChild(dot);
      }
    }

    function loadQuestion(index) {
      if (index >= 10) {
        showFinalSummary();
        return;
      }
      currentQuestionIndex = index;
      isTransitioning = false;
      renderProgressBar();

      const q = questions[currentQuestionIndex];
      currentTheme = q.theme;

      // 動態切換鮮明的主題向量背景
      const sceneryContainer = document.getElementById('bg-scenery-container');
      sceneryContainer.innerHTML = currentTheme.renderBackground();

      if (currentMode === 'concrete') {
        renderConcreteQuestion(q);
      } else {
        renderNumberLineQuestion(q);
      }
    }

    /* ==========================================================
       7. 模式一：具體湊數模式 (雙分區虛線 +「加了:X個」)
       ========================================================== */
    function renderConcreteQuestion(q) {
      const { A, B, C, emoji, theme } = q;
      
      // 頂部看板
      document.getElementById('concrete-formula-left').textContent = `${A} + ? = ${C}`;
      document.getElementById('concrete-target-num').textContent = C;
      document.getElementById('concrete-theme-title').textContent = `${theme.name}（湊滿 ${C} 個）`;
      
      // 引導語音 (女性語調)
      const promptStr = `這裡有 ${A} 個，要湊滿 ${C} 個，還需要加幾個？放好後點「回答」按鈕！`;
      document.getElementById('prompt-text').textContent = promptStr;
      speech.speak(promptStr);

      // 分區標題
      document.getElementById('tag-initial-label').textContent = `🌱 原有：${A} 個`;
      updateAddedBadge(0);

      // 籌碼庫初始擁有 10 個 Emoji
      reservoirCount = 10;
      renderReservoirShelf(emoji);

      // 重置原有清單與加入清單
      initialItems = [];
      addedItems = [];

      // 產生 A 個隨機分佈在原有分區 (subzone-initial)
      const positions = generateRandomCoordinates(A);
      for (let i = 0; i < A; i++) {
        initialItems.push({
          id: `init-${i}-${Date.now()}`,
          emoji: emoji,
          x: positions[i].x,
          y: positions[i].y
        });
      }

      renderInitialItems();
      renderAddedItems();
    }

    // 隨機座標產生器 (百分比 12% ~ 82%)
    function generateRandomCoordinates(count) {
      const coords = [];
      const minDistance = 18; // 防重疊距離

      for (let i = 0; i < count; i++) {
        let attempts = 0;
        let x, y, tooClose;
        do {
          x = Math.floor(Math.random() * 64) + 16; // 16% ~ 80%
          y = Math.floor(Math.random() * 62) + 18; // 18% ~ 80%
          tooClose = coords.some(c => Math.hypot(c.x - x, c.y - y) < minDistance);
          attempts++;
        } while (tooClose && attempts < 50);

        coords.push({ x, y });
      }
      return coords;
    }

    // 渲染原有範圍內的 Emoji
    function renderInitialItems() {
      const container = document.getElementById('content-initial-zone');
      container.innerHTML = '';

      initialItems.forEach(item => {
        const el = document.createElement('div');
        el.className = 'placed-emoji initial';
        el.textContent = item.emoji;
        el.id = item.id;
        el.style.left = `${item.x}%`;
        el.style.top = `${item.y}%`;
        el.style.transform = `translate(-50%, -50%) rotate(${Math.sin(item.x) * 15}deg)`;
        container.appendChild(el);
      });
    }

    // 渲染加入範圍內的 Emoji
    function renderAddedItems() {
      const container = document.getElementById('content-added-zone');
      container.innerHTML = '';

      addedItems.forEach(item => {
        const el = document.createElement('div');
        el.className = 'placed-emoji user-added';
        el.textContent = item.emoji;
        el.id = item.id;
        el.style.left = `${item.x}%`;
        el.style.top = `${item.y}%`;
        el.style.transform = `translate(-50%, -50%) rotate(${Math.sin(item.x) * 15}deg)`;
        el.title = '點擊可拿掉並退回籌碼庫';

        // 點擊已加入的 Emoji 可以移除退回籌碼庫
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          removeAddedItem(item.id);
        });

        container.appendChild(el);
      });
    }

    // 更新「加了:X個」標籤
    function updateAddedBadge(count) {
      document.getElementById('concrete-live-count').textContent = `加了：${count} 個`;
      document.getElementById('tag-added-label').textContent = `✨ 加入區（加了：${count} 個）`;
    }

    // 渲染底端籌碼庫
    function renderReservoirShelf(emoji) {
      const shelfRow = document.getElementById('reservoir-items-row');
      shelfRow.innerHTML = '';
      document.getElementById('reservoir-title').textContent = `${currentTheme.unitName}庫 (剩 ${reservoirCount})`;

      for (let i = 0; i < reservoirCount; i++) {
        const chip = document.createElement('div');
        chip.className = 'reservoir-chip';
        chip.textContent = emoji;
        chip.dataset.chipIndex = i;

        setupChipInteraction(chip, emoji);
        shelfRow.appendChild(chip);
      }
    }

    // 加入一個 Emoji 到右側「加入範圍」
    function addEmojiToAddedZone(emoji, clientX = null, clientY = null) {
      if (isTransitioning || reservoirCount <= 0) return;

      const addedZone = document.getElementById('content-added-zone');
      const rect = addedZone.getBoundingClientRect();

      let xPct, yPct;
      if (clientX !== null && clientY !== null) {
        // 根據手指釋放座標計算相對百分比
        xPct = Math.max(14, Math.min(86, ((clientX - rect.left) / rect.width) * 100));
        yPct = Math.max(16, Math.min(84, ((clientY - rect.top) / rect.height) * 100));
      } else {
        // 單純點擊籌碼：隨機散佈在加入區中
        const rand = generateRandomCoordinates(1)[0];
        xPct = rand.x;
        yPct = rand.y;
      }

      // 籌碼庫扣減一個 Emoji (從籌碼庫消失)
      reservoirCount--;
      renderReservoirShelf(emoji);

      addedItems.push({
        id: `user-${Date.now()}-${Math.random()}`,
        emoji: emoji,
        x: xPct,
        y: yPct
      });

      renderAddedItems();
      updateAddedBadge(addedItems.length);
      sound.playPop();
    }

    // 從加入範圍拿掉一個 Emoji (退回籌碼庫)
    function removeAddedItem(itemId) {
      if (isTransitioning) return;
      const index = addedItems.findIndex(i => i.id === itemId);
      if (index !== -1) {
        addedItems.splice(index, 1);
        reservoirCount++; // 退回籌碼庫
        renderAddedItems();
        renderReservoirShelf(questions[currentQuestionIndex].emoji);
        updateAddedBadge(addedItems.length);
        sound.playPop();
      }
    }

    function resetCurrentConcreteQuestion() {
      if (isTransitioning) return;
      questions[currentQuestionIndex].retries += 1;
      sound.playBoing();
      renderConcreteQuestion(questions[currentQuestionIndex]);
    }

    // 模式一：點擊「回答」按鈕確認作答
    function submitConcreteAnswer() {
      if (isTransitioning) return;
      const q = questions[currentQuestionIndex];
      const addedCount = addedItems.length;
      const totalCount = q.A + addedCount;

      if (totalCount === q.C) {
        // 答對成功
        isTransitioning = true;
        document.getElementById('concrete-formula-left').textContent = `${q.A} + ${addedCount} = ${q.C}`;
        sound.playSuccessFanfare();
        triggerConfetti();

        const successSpeech = `太棒了！原本有 ${q.A} 個，加上 ${addedCount} 個，剛好湊滿 ${q.C} 個！答對了！`;
        document.getElementById('prompt-text').textContent = `🎉 答對了！${q.A} + ${addedCount} = ${q.C}`;

        // 確保女性語音完整說完後，再平滑過渡到下一題
        let advanced = false;
        const advanceToNext = () => {
          if (advanced) return;
          advanced = true;
          setTimeout(() => {
            loadQuestion(currentQuestionIndex + 1);
          }, 800); // 語音播報完畢後微停頓 0.8 秒
        };

        speech.speak(successSpeech, advanceToNext);
        setTimeout(advanceToNext, 5000); // 保底計時器防止部分瀏覽器遺失 onend 事件
      } else {
        // 未達或超過：提示調整
        q.retries += 1;
        sound.playBoing();
        const dropArea = document.getElementById('concrete-drop-area');
        dropArea.classList.add('shake-error');
        setTimeout(() => dropArea.classList.remove('shake-error'), 450);

        if (totalCount < q.C) {
          const need = q.C - totalCount;
          const hint = `現在加了 ${addedCount} 個，要湊滿 ${q.C} 個，還差 ${need} 個喔！再多加幾個人進來！`;
          speech.speak(hint);
          document.getElementById('prompt-text').textContent = `💡 還差 ${need} 個才滿 ${q.C} 個喔！`;
        } else {
          const excess = totalCount - q.C;
          const hint = `哎呀，加了 ${addedCount} 個，總數超過 ${q.C} 個囉！點擊拿走多餘的，再回答一次！`;
          speech.speak(hint);
          document.getElementById('prompt-text').textContent = `⚠️ 多加了 ${excess} 個，點擊右邊 Emoji 可以拿走喔！`;
        }
      }
    }

    // 綁定籌碼 Pointer Events 拖曳
    const dragGhost = document.getElementById('drag-ghost');
    let activePointerId = null;

    function setupChipInteraction(chip, emoji) {
      let isDragging = false;
      let startX = 0, startY = 0;

      chip.addEventListener('pointerdown', (e) => {
        if (isTransitioning) return;
        sound.init();
        activePointerId = e.pointerId;
        chip.setPointerCapture(e.pointerId);
        isDragging = false;
        startX = e.clientX;
        startY = e.clientY;

        dragGhost.textContent = emoji;
        dragGhost.style.left = `${e.clientX}px`;
        dragGhost.style.top = `${e.clientY}px`;
      });

      chip.addEventListener('pointermove', (e) => {
        if (activePointerId !== e.pointerId) return;
        if (!isDragging && (Math.hypot(e.clientX - startX, e.clientY - startY) > 8)) {
          isDragging = true;
          dragGhost.style.display = 'block';
        }

        if (isDragging) {
          dragGhost.style.left = `${e.clientX}px`;
          dragGhost.style.top = `${e.clientY}px`;

          // 判斷是否懸停在右側「加入區」
          const addedZone = document.getElementById('subzone-added');
          const rect = addedZone.getBoundingClientRect();
          const inside = (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom);
          addedZone.classList.toggle('drag-over', inside);
        }
      });

      const handlePointerEnd = (e) => {
        if (activePointerId !== e.pointerId) return;
        activePointerId = null;
        dragGhost.style.display = 'none';

        const addedZone = document.getElementById('subzone-added');
        addedZone.classList.remove('drag-over');

        const rect = addedZone.getBoundingClientRect();
        const insideAddedZone = (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom);

        if (isDragging) {
          if (insideAddedZone) {
            addEmojiToAddedZone(emoji, e.clientX, e.clientY);
          }
        } else {
          // 單純點擊籌碼：直接加入加入區
          addEmojiToAddedZone(emoji, null, null);
        }
      };

      chip.addEventListener('pointerup', handlePointerEnd);
      chip.addEventListener('pointercancel', handlePointerEnd);
    }

    /* ==========================================================
       8. 模式二：數軸位移模式 (調整語音說完再跳題)
       ========================================================== */
    function renderNumberLineQuestion(q) {
      const { A, B, C, theme } = q;
      numberLineCurrentTick = A;

      document.getElementById('nl-formula-badge').textContent = `${A} + ? = ${C}`;
      document.getElementById('nl-start-val').textContent = A;
      document.getElementById('nl-target-val').textContent = C;
      document.getElementById('nl-step-val').textContent = `0 格`;

      const promptStr = `從 ${A} 到終點 ${C}，需要往右邊走多少格？拖動車車到目標後點「確認回答」！`;
      document.getElementById('prompt-text').textContent = promptStr;
      speech.speak(promptStr);

      // 1. 生成 10 個標準格數區塊 (Grid Cells)
      const gridContainer = document.getElementById('grid-cells-container');
      gridContainer.innerHTML = '';
      for (let i = 0; i < 10; i++) {
        const cell = document.createElement('div');
        cell.className = 'road-grid-cell';
        cell.dataset.cellIndex = i;
        gridContainer.appendChild(cell);
      }

      // 2. 生成 0 ~ 10 共 11 個刻度點與數字 (完美居中對齊 translateX(-50%))
      const ticksLayer = document.getElementById('ticks-layer');
      ticksLayer.innerHTML = '';

      for (let i = 0; i <= 10; i++) {
        const node = document.createElement('div');
        node.className = 'tick-node';
        node.style.left = `${i * 10}%`;

        const mark = document.createElement('div');
        mark.className = 'tick-line-mark';

        const pill = document.createElement('div');
        pill.className = 'tick-number-pill';
        pill.textContent = i;
        pill.dataset.tick = i;

        if (i === A) pill.classList.add('start-point');
        if (i === C) {
          pill.classList.add('target-goal');
          const flag = document.createElement('div');
          flag.className = 'goal-flag-icon';
          flag.textContent = '🏁';
          node.appendChild(flag);
        }

        pill.addEventListener('click', () => onNumberLineTickClick(i));

        node.appendChild(mark);
        node.appendChild(pill);
        ticksLayer.appendChild(node);
      }

      // 3. 設置車輛初始位置
      const vehicle = document.getElementById('draggable-vehicle');
      vehicle.textContent = theme.vehicle || '🚗';
      updateVehiclePosition(A);
      setupVehicleDrag();
    }

    function onNumberLineTickClick(targetTick) {
      if (isTransitioning) return;
      sound.playTick();
      updateVehiclePosition(targetTick);
    }

    function updateVehiclePosition(tick) {
      numberLineCurrentTick = tick;
      const vehicle = document.getElementById('draggable-vehicle');
      vehicle.style.left = `${tick * 10}%`;

      const q = questions[currentQuestionIndex];
      const steps = tick - q.A;
      
      if (steps >= 0) {
        document.getElementById('nl-step-val').textContent = `${steps} 格`;
      } else {
        document.getElementById('nl-step-val').textContent = `向左 ${Math.abs(steps)} 格`;
      }

      updateWalkedHighlight(q.A, tick);
    }

    function updateWalkedHighlight(startTick, currentTick) {
      const cells = document.querySelectorAll('.road-grid-cell');
      cells.forEach((cell, idx) => {
        const isWalked = (currentTick > startTick && idx >= startTick && idx < currentTick);
        cell.classList.toggle('highlight-walked', isWalked);
        
        let tag = cell.querySelector('.grid-cell-seq-tag');
        if (isWalked) {
          const stepNum = idx - startTick + 1;
          if (!tag) {
            tag = document.createElement('div');
            tag.className = 'grid-cell-seq-tag';
            cell.appendChild(tag);
          }
          tag.textContent = `第${stepNum}格`;
        } else if (tag) {
          tag.remove();
        }
      });

      renderJumpArcs(startTick, currentTick);
    }

    function renderJumpArcs(start, end) {
      const svg = document.getElementById('jump-arc-svg');
      svg.innerHTML = '';
      if (end <= start) return;

      const svgRect = svg.getBoundingClientRect();
      const totalWidth = svgRect.width;

      for (let s = start; s < end; s++) {
        const x1 = (s / 10) * totalWidth;
        const x2 = ((s + 1) / 10) * totalWidth;
        const midX = (x1 + x2) / 2;
        const arcY = 25;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${x1} 75 Q ${midX} ${arcY} ${x2} 75`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', '#ff7043');
        path.setAttribute('stroke-width', '4');
        path.setAttribute('stroke-dasharray', '6,4');
        svg.appendChild(path);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', midX);
        text.setAttribute('y', arcY - 4);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('fill', '#d84315');
        text.setAttribute('font-size', '16');
        text.setAttribute('font-weight', '900');
        text.textContent = '+1';
        svg.appendChild(text);
      }
    }

    function setupVehicleDrag() {
      const vehicle = document.getElementById('draggable-vehicle');
      const road = document.getElementById('road-track');
      let isDragging = false;
      let lastTick = numberLineCurrentTick;

      vehicle.onpointerdown = (e) => {
        if (isTransitioning) return;
        sound.init();
        isDragging = true;
        vehicle.setPointerCapture(e.pointerId);
        lastTick = numberLineCurrentTick;
      };

      vehicle.onpointermove = (e) => {
        if (!isDragging) return;
        const rect = road.getBoundingClientRect();
        const clientX = e.clientX;
        let ratio = (clientX - rect.left) / rect.width;
        ratio = Math.max(0, Math.min(1, ratio));

        const snappedTick = Math.round(ratio * 10);
        vehicle.style.left = `${snappedTick * 10}%`;

        if (snappedTick !== lastTick) {
          sound.playTick();
          lastTick = snappedTick;
          updateVehiclePosition(snappedTick);
        }
      };

      const endDrag = (e) => {
        if (!isDragging) return;
        isDragging = false;
        updateVehiclePosition(lastTick);
      };

      vehicle.onpointerup = endDrag;
      vehicle.onpointercancel = endDrag;
    }

    function resetCurrentNumberLineQuestion() {
      if (isTransitioning) return;
      const q = questions[currentQuestionIndex];
      sound.playBoing();
      updateVehiclePosition(q.A);
      speech.speak(`退回起點 ${q.A}，再數一次往右走幾格！`);
    }

    // 模式二：點擊「確認回答」按鈕 (確保語音播完後才跳題)
    function submitNumberLineAnswer() {
      if (isTransitioning) return;
      const q = questions[currentQuestionIndex];
      const finalTick = numberLineCurrentTick;
      const walkedSteps = finalTick - q.A;

      if (finalTick === q.C) {
        // 答對成功
        isTransitioning = true;
        document.getElementById('nl-formula-badge').textContent = `${q.A} + ${walkedSteps} = ${q.C}`;
        sound.playHorn();
        sound.playSuccessFanfare();
        triggerConfetti();

        const successSpeech = `由 ${q.A} 走到 ${q.C}，剛好向右走了 ${walkedSteps} 格！答對了！`;
        document.getElementById('prompt-text').textContent = `🎉 抵達終點！向右走 ${walkedSteps} 格 (${q.A} + ${walkedSteps} = ${q.C})`;

        // 確保女性語音完整說完後，再平滑過渡到下一題
        let advanced = false;
        const advanceToNext = () => {
          if (advanced) return;
          advanced = true;
          setTimeout(() => {
            loadQuestion(currentQuestionIndex + 1);
          }, 800); // 語音結束後停留 0.8 秒
        };

        speech.speak(successSpeech, advanceToNext);
        setTimeout(advanceToNext, 5200); // 保底計時器防掉事件
      } else {
        // 錯誤：引導提示
        q.retries += 1;
        sound.playBoing();
        const road = document.getElementById('road-track');
        road.classList.add('shake-error');
        setTimeout(() => road.classList.remove('shake-error'), 450);

        if (finalTick < q.C) {
          const hint = `現在停在 ${finalTick}，向右走了 ${walkedSteps} 格，還沒到終點 ${q.C} 喔！再往右多走幾格！`;
          speech.speak(hint);
          document.getElementById('prompt-text').textContent = `💡 還沒到終點 ${q.C} 喔，再往前走！`;
        } else {
          const hint = `現在停在 ${finalTick}，走過頭了喔！終點是 ${q.C}，往回調整一下再回答！`;
          speech.speak(hint);
          document.getElementById('prompt-text').textContent = `⚠️ 走過頭了，終點是 ${q.C}！`;
        }
      }
    }

    /* ==========================================================
       9. 結算獎勵
       ========================================================== */
    function showFinalSummary() {
      isTransitioning = true;
      sound.playSuccessFanfare();
      triggerConfetti();

      let totalRetries = 0;
      questions.forEach(q => totalRetries += q.retries);

      const modal = document.getElementById('summary-modal');
      const statsContent = document.getElementById('summary-stats-content');
      statsContent.innerHTML = `
        🎉 成功完成 10 題蒙特梭利數感挑戰！<br>
        🌟 答題精準度：${totalRetries === 0 ? '一氣呵成！零失誤' : `穩步前進，重試次數：${totalRetries} 次`}<br>
        💡 成功掌握 10 以內的數拆解與線性位移！
      `;
      modal.classList.add('show');
      speech.speak('恭喜你！完成了十道題目，你已經是個厲害的數感小天才囉！');
    }

    function closeSummaryModal() {
      document.getElementById('summary-modal').classList.remove('show');
    }

    function restartRound() {
      closeSummaryModal();
      questions = QuestionGenerator.generateQuestions(10);
      loadQuestion(0);
    }

    // 啟動初始化
    window.addEventListener('DOMContentLoaded', () => {
      questions = QuestionGenerator.generateQuestions(10);
      loadQuestion(0);
    });
  </script>
</body>
